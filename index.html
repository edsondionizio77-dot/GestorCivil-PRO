function renderContratoVistoriaPDF() {
  const l = state.laudoAtual;
  if (!l) { state.view = 'laudos'; return ''; }
  const emp = state.empresa || {};
  const cli = l.dadosObra?.cliente || {};
  const obra = l.dadosObra?.obra || {};
  const c = l.contrato || {};
  const total = Number(c.valorTotal || 0);
  const nParc = c.nParcelas || 2;
  const prazo = c.prazoDias || 60;
  const valorParcela = nParc > 0 ? total / nParc : total;
  const hoje = fmtData(new Date().toISOString().slice(0, 10));
  const clausula = (n, titulo, corpo) => `
    <h2 style="font-family:-apple-system,system-ui,sans-serif;font-size:13px;font-weight:700;color:var(--primary);margin-top:18px;">${n}. ${titulo}</h2>
    <div style="font-size:12px;line-height:1.6;text-align:justify;">${corpo}</div>`;

  return `
    <div class="stack">
      <div class="row-between flex-wrap no-print">
        <button class="back-btn" onclick="actions.voltarLaudo()">${ICON.chevronLeft} Voltar à vistoria</button>
        <button class="btn btn-primary" onclick="actions.imprimir()">${ICON.printer} Baixar PDF</button>
      </div>
      <div class="print-page recibo-page">
        <div class="recibo-header">
          ${renderLogoDoc(56)}
          <div class="recibo-empresa">
            <div class="recibo-empresa-nome">${esc(emp.nome || 'Sua Empresa')}</div>
            <div class="recibo-empresa-dados">
              ${emp.cnpj ? `CNPJ ${esc(emp.cnpj)}` : ''}
              ${emp.endereco ? `<br>${esc(emp.endereco)}` : ''}
              ${emp.telefone ? `<br>Tel: ${esc(emp.telefone)}` : ''}
              ${emp.email ? ` • ${esc(emp.email)}` : ''}
              ${emp.crea ? `<br>${esc(emp.crea)}` : ''}
              ${emp.crt ? ` • ${esc(emp.crt)}` : ''}
            </div>
          </div>
        </div>
        <div class="recibo-titulo">
          <h1>CONTRATO DE PRESTAÇÃO DE SERVIÇOS TÉCNICOS</h1>
          <div style="font-size:13px;color:var(--muted);margin-top:6px;">Vistoria Técnica de Patologias Construtivas · Monitoramento de Fissuras · Emissão de TRT/CRT-BA</div>
          <div style="font-size:13px;color:var(--primary);font-weight:700;margin-top:8px;">Contrato Nº ${esc(l.numero || '—')}${l.dadosObra?.osNumero ? '  |  OS ' + esc(l.dadosObra.osNumero) : ''}</div>
          <div style="font-size:12px;color:var(--muted);">${esc(emp.sede || emp.cidade || (emp.endereco ? emp.endereco.split(',').slice(-1)[0].trim() : '') || '____')}, ${hoje}</div>
        </div>
        <div class="recibo-corpo">
          <h2 style="font-family:-apple-system,system-ui,sans-serif;font-size:14px;font-weight:700;color:var(--primary);margin-top:16px;">1. IDENTIFICAÇÃO DAS PARTES</h2>
          <div style="font-size:11px;font-weight:700;color:var(--muted);margin-top:8px;">CONTRATANTE</div>
          <table class="ficha-table" style="font-size:12px;">
            <tbody>
              <tr><td><strong>Nome</strong></td><td>${esc(cli.nome || '—')}</td></tr>
              ${c.contratanteRG ? `<tr><td><strong>RG</strong></td><td>${esc(c.contratanteRG)}</td></tr>` : ''}
              ${cli.cpfCnpj ? `<tr><td><strong>CPF/CNPJ</strong></td><td>${esc(cli.cpfCnpj)}</td></tr>` : ''}
              ${(obra.endereco || cli.endereco) ? `<tr><td><strong>Endereço do imóvel</strong></td><td>${esc(obra.endereco || cli.endereco)}</td></tr>` : ''}
            </tbody>
          </table>
          <div style="font-size:11px;font-weight:700;color:var(--muted);margin-top:12px;">CONTRATADA</div>
          <table class="ficha-table" style="font-size:12px;">
            <tbody>
              <tr><td><strong>Razão Social</strong></td><td>${esc(emp.nome || '')}</td></tr>
              ${emp.cnpj ? `<tr><td><strong>CNPJ</strong></td><td>${esc(emp.cnpj)}</td></tr>` : ''}
              <tr><td><strong>Responsável Técnico</strong></td><td>${esc(emp.responsavel || '')}</td></tr>
              ${emp.crea ? `<tr><td><strong>CREA-BA</strong></td><td>${esc(emp.crea.replace(/CREA-BA\s*/i,''))}</td></tr>` : ''}
              ${emp.crt ? `<tr><td><strong>CRT-BA</strong></td><td>${esc(emp.crt.replace(/CRT-BA\s*/i,''))}</td></tr>` : ''}
            </tbody>
          </table>
          ${clausula('2','OBJETO','Prestação de serviços técnicos de Vistoria Técnica de patologias construtivas, com monitoramento sistemático de fissuras e demais manifestações patológicas, registros técnicos periódicos, elaboração de Relatório Técnico de Vistoria e emissão de Termo de Responsabilidade Técnica (TRT) junto ao CRT-BA.')}
          ${clausula('3','ESCOPO TÉCNICO',`(a) Vistoria inicial com levantamento das manifestações patológicas (fissuras, trincas e demais anomalias construtivas); (b) monitoramento com três instrumentos — paquímetro digital, fissurômetro e selos de gesso — conforme NBR 6118:2014; (c) acompanhamento técnico durante ${prazo} dias, com inspeções periódicas e registro fotográfico; (d) elaboração de Relatório Técnico de Vistoria com acompanhamento evolutivo; (e) emissão do TRT perante o CRT-BA; e (f) entrega da documentação em formato digital.`)}
          ${clausula('4','PRAZO',`${prazo} dias corridos, contados da assinatura. Prorrogação por aditivo.`)}
          ${clausula('5','VALOR E PAGAMENTO',`Valor total: <strong>${fmtBRL(total)}</strong>. Forma: ${nParc} parcela(s) de <strong>${fmtBRL(valorParcela)}</strong> — 1ª na assinatura; a última na entrega do Relatório Técnico e do TRT/CRT-BA. Aceita-se transferência, Pix ou outro meio acordado. Valor fixo, sem reajuste.`)}
          ${clausula('6','RESPONSABILIDADE TÉCNICA',`Serviços sob responsabilidade técnica de ${esc(emp.responsavel || '')}${emp.crea ? ', ' + esc(emp.crea) : ''}${emp.crt ? ' e ' + esc(emp.crt) : ''}, exercida com fundamento no registro no CRT-BA (título de Vistoria e Relatório Técnico em Edificação), perante o qual será emitido o TRT.`)}
          ${clausula('7','LIMITAÇÃO DE ESCOPO','Projetos de reforço estrutural, obras de reparo ou outros serviços não previstos deverão ser objeto de instrumento específico.')}
          ${clausula('8','FORO',`Comarca de ${getCidade(emp)}. Celebrado em 2 (duas) vias.`)}
          <div style="margin-top:40px;text-align:center;font-size:12px;color:var(--muted);">${esc(emp.sede || emp.cidade || (emp.endereco ? emp.endereco.split(',').slice(-1)[0].trim() : '') || '____')}, ${hoje}</div>
          <div style="display:flex;justify-content:space-between;margin-top:48px;gap:24px;">
            <div style="flex:1;text-align:center;border-top:1px solid #333;padding-top:6px;font-size:11px;">
              <strong>${esc(cli.nome || '—')}</strong><br>CONTRATANTE${cli.cpfCnpj ? '<br>CPF: ' + esc(cli.cpfCnpj) : ''}
            </div>
            <div style="flex:1;text-align:center;border-top:1px solid #333;padding-top:6px;font-size:11px;">
              <strong>${esc(emp.responsavel || '')}</strong><br>CONTRATADA${emp.crt ? '<br>' + esc(emp.crt) : ''}
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;margin-top:36px;gap:24px;">
            <div style="flex:1;text-align:center;border-top:1px solid #999;padding-top:6px;font-size:10px;color:var(--muted);">
              Nome: _______________________<br>CPF: _______________________<br>Testemunha 1
            </div>
            <div style="flex:1;text-align:center;border-top:1px solid #999;padding-top:6px;font-size:10px;color:var(--muted);">
              Nome: _______________________<br>CPF: _______________________<br>Testemunha 2
            </div>
          </div>
        </div>
      </div>
    </div>
  `;
}

      <div class="row-between" style="align-items:center;">
        <button class="back-btn" onclick="actions.irParaListaMaterial()">${ICON.chevronLeft} Listas</button>

            style="width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px;">

        <!-- Tabela de itens -->

        </button>

}

function renderListaMaterialSugestoes(busca) {
  if (!busca || busca.length < 2) return '';
  const sugestoes = state.catalogo
    .filter(i => i.desc.toLowerCase().includes(busca.toLowerCase()))
    .slice(0, 6);
  if (sugestoes.length === 0) return `<div style="padding:12px 14px; font-size:13px; color:var(--muted);">Nenhum item encontrado no catálogo.</div>`;
  return sugestoes.map(it => `
    <button style="width:100%; text-align:left; padding:10px 14px; border:none; background:none; cursor:pointer; border-bottom:1px solid var(--border); font-size:13px;"
      onmousedown="event.preventDefault(); actions.listaMaterialAddDoCatalogo('${it.id}')">
      <div style="font-weight:600;">${esc(it.desc)}</div>
      <div style="font-size:11px; color:var(--muted);">${esc(it.cat)} · ${esc(it.un)}</div>
    </button>
  `).join('');
}

function renderListaMaterialItens(l) {
  if (!l || l.itens.length === 0) return `
    <div style="text-align:center; padding:16px; color:var(--muted); font-size:13px;">
      Busque no catálogo ou adicione um item livre abaixo.
    </div>`;
  return `
    <table style="width:100%; border-collapse:collapse; font-size:13px; margin-bottom:8px;">
      <thead>
        <tr style="background:var(--bg-soft);">
          <th style="padding:8px 6px; text-align:left; font-size:12px;">Material</th>
          <th style="padding:8px 6px; text-align:right; font-size:12px; width:70px;">Qtd</th>
          <th style="padding:8px 6px; text-align:left; font-size:12px; width:54px;">Un</th>

function montarTextoListaMaterial(l) {
  const emp = state.empresa || {};
  const hoje = fmtData(new Date().toISOString().slice(0, 10));
  const L = [];
  L.push('*LISTA DE MATERIAL*');
  L.push(`${emp.nome || ''}`);
  L.push(hoje);
  if (l.nome) L.push(`*${l.nome}*`);
  if (l.obra) L.push(`Obra: ${l.obra}`);
  L.push('');
  l.itens.forEach((it, idx) => {
    const linha = `${idx + 1}. ${it.nome || 'Item'} — *${it.qtd} ${it.un}*`;
    L.push(linha);
  });
  L.push('');
  L.push(`Total: ${l.itens.length} item(s)`);
  return L.join('\n');
}

function renderDrywallPDF() {
  const d = state.drywall;

  const hoje = fmtData(today());
  const isParede = aba === 'parede';

    [`Placa Drywall ${d.tipoPlaca||'ST'}`, r.nPlacas, 'un', r.placa.nome],

    [`Montante ${d.perfil||70} mm`, r.montanteBarras, 'barras', `${r.nMontantes} peças`],

    ['Parafuso Auto Brocante Flangeado Phillips 4,2×13', r.parafusosMetal, 'un', 'metal/metal'],
    ['Fita para juntas', r.fitaML, 'm', `fator ${fmtDec(d.fitaFator||2)} m/m²`],

        <div style="font-size:12px; opacity:0.85;">${r.placa.nome} · montante a cada ${fmtDec(r.espMontante)} m</div>

        ${linha(`Guia ${d.perfil||70} mm`, `${r.guiaBarras} barras`, `${fmtDec(r.guiaML)} m — piso e teto (barra 3 m)`)}
        ${linha(`Montante ${d.perfil||70} mm`, `${r.montanteBarras} barras`, `${r.nMontantes} peças a cada ${fmtDec(r.espMontante)} m`)}
        ${linha('GGP25 3,5×25mm pta. agulha', `${r.parafusosPlaca} un`, `${d.parafusoM2 || 25}/m²`)}

        ${linha('Fita para juntas', `${r.fitaML} m`, `fator ${fmtDec(d.fitaFator || 2)} m/m²`)}
        ${linha('Massa para juntas', `${r.massaKg} kg`, `fator ${fmtDec(d.massaFator || 0.5)} kg/m²`)}
        ${r.laM2 > 0 ? linha('Isolamento (lã)', `${r.laM2} m²`, 'lã de vidro ou PET') : ''}
      </div>
    `;
  } else {
    const r = calcForroDrywall(d);
    if (r.area <= 0) return `<div class="card"><div style="text-align:center; color:var(--muted); font-size:13px; padding:12px;">Informe a área do forro para calcular.</div></div>`;
    return `
      <div class="card" style="background:linear-gradient(135deg, var(--primary), var(--primary-dark, #1a3a5c)); color:white;">
        <div style="font-size:12px; opacity:0.85;">FORRO · ${fmtDec(r.area)} m²</div>
        <div style="font-size:22px; font-weight:800; margin-top:2px;">${r.nPlacas} placas</div>
        <div style="font-size:12px; opacity:0.85;">${r.placa.nome}</div>
      </div>
      <div class="card">
        <div class="card-title">Lista de material</div>
        ${linha(`Placa Drywall ${d.tipoPlaca||'ST'}`, `${r.nPlacas} un`, r.placa.nome)}
        ${linha('Canaleta C F530', `${r.canaletaBarras} barras`, `${r.canaletaML} m (barra 3 m)`)}
        ${linha('Tirantes/pendurais', `${r.nTirantes} un`, '~1,7/m²')}
        ${r.cantoneiraML > 0 && d.acabamentoPerim !== 'nenhum' ? linha(d.acabamentoPerim === 'tabica' ? esc(d.tabicaDesc||'Tabica') : `Perfil Cantoneira Tipo L Perfurada ${esc(d.cantoDesc||'25×25mm')}`, `${r.cantoneiraML} m`, 'acabamento perimetral') : ''}
        ${linha('Parafusos', `${r.parafusos} un`, `${d.parafusoM2 || 25}/m²`)}
        ${linha('Fita para juntas', `${r.fitaML} m`, `fator ${fmtDec(d.fitaFator || 2)} m/m²`)}
        ${linha('Massa para juntas', `${r.massaKg} kg`, `fator ${fmtDec(d.massaFator || 0.5)} kg/m²`)}
      </div>
    `;
  }
}

function montarTextoDrywall(d) {
  const emp = state.empresa || {};
  const aba = d.aba || 'parede';
  const L = [];
  L.push('*LISTA DE MATERIAL — DRYWALL*');
  L.push(`${emp.nome || ''}`);
  L.push(fmtData(today()));
  L.push('');
  if (aba === 'parede') {
    const r = calcParedeDrywall(d);
    if (r.areaFace <= 0) return 'Informe as medidas da parede.';
    L.push(`*PAREDE* — ${fmtDec(r.areaFace)} m²/face (${fmtDec(r.areaTotal)} m² total)`);
    L.push('');
    L.push(`Placas (${r.placa.nome}): *${r.nPlacas} un*`);
    L.push(`Guia ${d.perfil||70}mm: *${r.guiaBarras} barras* (${fmtDec(r.guiaML)} m)`);
    L.push(`Montante ${d.perfil||70}mm: *${r.montanteBarras} barras* (${r.nMontantes} peças)`);
    L.push(`GGP25 3,5×25mm: *${r.parafusosPlaca} un*`);
    L.push(`Parafuso Auto Brocante Flangeado Phillips 4,2×13: *${r.parafusosMetal} un*`);
    L.push(`Fita: *${r.fitaML} m*`);
    L.push(`Massa: *${r.massaKg} kg*`);
    if (r.laM2 > 0) L.push(`Isolamento (lã): *${r.laM2} m²*`);
  } else {
    const r = calcForroDrywall(d);
    if (r.area <= 0) return 'Informe a área do forro.';
    L.push(`*FORRO* — ${fmtDec(r.area)} m²`);
    L.push('');
    L.push(`Placas (${r.placa.nome}): *${r.nPlacas} un*`);
    L.push(`Canaleta C F530: *${r.canaletaBarras} barras* (${r.canaletaML} m)`);
    L.push(`Tirantes: *${r.nTirantes} un*`);
    if (r.cantoneiraML > 0 && d.acabamentoPerim !== 'nenhum') L.push(`${d.acabamentoPerim === 'tabica' ? (d.tabicaDesc||'Tabica') : ('Perfil Cantoneira Tipo L Perfurada ' + (d.cantoDesc||'25×25mm'))}: *${r.cantoneiraML} m*`);
    L.push(`Parafusos: *${r.parafusos} un*`);
    L.push(`Fita: *${r.fitaML} m*`);
    L.push(`Massa: *${r.massaKg} kg*`);
  }
  L.push('');
  L.push('_Base: NBR 15758. Valores estimados, confira em obra._');
  return L.join('\n');
}

function renderAmbienteTotal(amb) {

        ${r.piso.area>0?`<span>Piso: ${fmtDec(r.piso.area,2)} m²</span>`:''}

function montarTextoMedicaoCeramica(m) {
  const emp=state.empresa||{};
  const tot=calcMedicaoTotal(m.ambientes);
  const L=['*MEDIÇÃO DE REVESTIMENTO CERÂMICO*',emp.nome||'',fmtData(m.data)];
  if(m.nome)L.push('*'+m.nome+'*');
  if(m.obra)L.push('Obra: '+m.obra);
  L.push('');
  m.ambientes.forEach(amb=>{
    const r=calcAmbienteTotal(amb);
    if(r.area<=0)return;
    L.push('*'+esc(amb.nome||'Ambiente')+'*');
    if(r.rev.area>0){
      L.push('  Paredes: '+fmtDec(r.rev.area,2)+' m²'+(r.rev.nCaixas>0?' → '+r.rev.nCaixas+' cx':''));
      L.push('  Arg. '+r.rev.acTipo+': '+r.rev.argaKg+' kg ('+Math.ceil(r.rev.argaKg/20)+' sacos) | Rej.: '+r.rev.rejunteKg+' kg');
    }
    if(r.piso.area>0){
      L.push('  Piso: '+fmtDec(r.piso.area,2)+' m²'+(r.piso.nCaixas>0?' → '+r.piso.nCaixas+' cx':''));
      L.push('  Arg.: '+r.piso.argaKg+' kg ('+Math.ceil(r.piso.argaKg/20)+' sacos) | Rej.: '+r.piso.rejunteKg+' kg');
    }
  });
  if(m.ambientes.length>1){
    L.push('');
    L.push('*TOTAL: '+fmtDec(tot.area,2)+' m²'+(tot.nCaixas>0?' · '+tot.nCaixas+' cx':'')+' · '+tot.argaKg+' kg arg. ('+Math.ceil(tot.argaKg/20)+' sacos)*');
  }
  return L.join('\n');
}

function renderMedicaoCeramicaPDF() {
  const m=state.medicaoCeramicaAtual;
  if(!m){state.view='medicaoCeramica';return renderMedicaoCeramica();}
  const emp=state.empresa||{};
  const tot=calcMedicaoTotal(m.ambientes);
  const hoje=fmtData(today());
  const linhaSuperficie=(s,tipo)=>{
    const r=calcSuperficieCeramica(s);
    const areaBruta=s.modo==='direta'?nnum(s.areaDireta):nnum(s.larg)*nnum(s.alt);
    const areaDesc=(s.descontos||[]).reduce((a,d)=>a+nnum(d.larg)*nnum(d.alt),0);
    return `<tr style="border-bottom:1px solid #eee;${!s.ativa?'opacity:0.35;':''}">
      <td style="padding:6px 8px;">${esc(s.nome||'—')}</td>
      <td style="padding:6px 8px;text-align:center;">${s.argamassaTipo}</td>
      <td style="padding:6px 8px;text-align:right;">${fmtDec(areaBruta,2)}</td>
      <td style="padding:6px 8px;text-align:right;color:var(--danger);">${areaDesc>0?'−'+fmtDec(areaDesc,2):'—'}</td>
      <td style="padding:6px 8px;text-align:right;font-weight:600;">${s.ativa?fmtDec(r.area,2):'—'}</td>
      <td style="padding:6px 8px;text-align:right;">${s.ativa?fmtDec(r.area,2)+' m²':'—'}</td>

      <div class="row-between flex-wrap no-print">
        <button class="back-btn" onclick="actions.abrirMedicaoCeramica('${m.id}')">${ICON.chevronLeft} Voltar</button>
        <button class="btn btn-primary" onclick="window.print()">${ICON.printer} Imprimir / PDF</button>
      </div>
      <div class="print-page recibo-page">
        <div class="recibo-header">
          ${renderLogoDoc(56)}
          <div class="recibo-empresa">
            <div class="recibo-empresa-nome">${esc(emp.nome||'Sua Empresa')}</div>
            <div class="recibo-empresa-dados">${emp.cnpj?'CNPJ '+esc(emp.cnpj):''}${emp.telefone?'<br>Tel: '+esc(emp.telefone):''}${emp.email?' • '+esc(emp.email):''}</div>
          </div>
        </div>
        <div class="recibo-titulo">
          <h1>MEDIÇÃO DE REVESTIMENTO CERÂMICO</h1>
          ${m.nome?`<div style="font-size:14px;font-weight:600;color:var(--primary);">${esc(m.nome)}</div>`:''}
          ${m.obra?`<div style="font-size:13px;color:var(--muted);">Obra: ${esc(m.obra)}</div>`:''}
          <div style="font-size:12px;color:var(--muted);">${hoje}</div>
        </div>
        <div class="recibo-corpo">
          ${m.ambientes.map(amb=>{
            const r=calcAmbienteTotal(amb);
            const thStyle='padding:6px 8px;text-align:';
            const tabHeader=`<table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:6px;">
              <thead><tr style="background:var(--primary);color:white;">
                <th style="${thStyle}left;">Superfície</th>
                <th style="${thStyle}center;width:44px;">AC</th>
                <th style="${thStyle}right;width:64px;">Bruta(m²)</th>
                <th style="${thStyle}right;width:60px;">Desconto</th>
                <th style="${thStyle}right;width:64px;">Área líq.</th>
                <th style="${thStyle}right;width:60px;">Caixas</th>
                <th style="${thStyle}right;width:64px;">Arg.(kg)</th>
              </tr></thead><tbody>`;
            return `
              <h2 style="font-size:14px;font-weight:700;color:var(--primary);margin:20px 0 6px;border-bottom:2px solid var(--primary);padding-bottom:4px;">
                ${esc(amb.nome||'Ambiente')}
              </h2>
              ${amb.revestimentos.length>0?`
                <div style="font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;">▸ REVESTIMENTO (PAREDES)</div>
                ${tabHeader}${amb.revestimentos.map(s=>linhaSuperficie(s,'revestimento')).join('')}</tbody>
                <tfoot><tr style="background:var(--bg-soft);font-weight:700;">
                  <td colspan="4" style="padding:6px 8px;">Subtotal paredes</td>
                  <td style="padding:6px 8px;text-align:right;">${fmtDec(r.rev.area,2)} m²</td>
                  <td style="padding:6px 8px;text-align:right;">${Math.ceil(r.rev.argaKg/20)} saco(s) arg.</td>
                  <td style="padding:6px 8px;text-align:right;">${r.rev.argaKg} kg</td>
                </tr></tfoot></table>`:''}
              ${amb.pisos.length>0?`
                <div style="font-size:11px;font-weight:600;color:var(--muted);margin:10px 0 4px;">▸ PISO</div>
                ${tabHeader}${amb.pisos.map(s=>linhaSuperficie(s,'piso')).join('')}</tbody>
                <tfoot><tr style="background:var(--bg-soft);font-weight:700;">
                  <td colspan="4" style="padding:6px 8px;">Subtotal piso</td>
                  <td style="padding:6px 8px;text-align:right;">${fmtDec(r.piso.area,2)} m²</td>
                  <td style="padding:6px 8px;text-align:right;">${Math.ceil(r.piso.argaKg/20)} saco(s) arg.</td>
                  <td style="padding:6px 8px;text-align:right;">${r.piso.argaKg} kg</td>
                </tr></tfoot></table>`:''}`;
          }).join('')}

          ${(()=>{
            // RESUMO DE COMPRAS: agrupa por tipo de argamassa e totaliza
            const acTotais={};
            let rejTotal=0;
            m.ambientes.forEach(amb=>{
              [...(amb.revestimentos||[]),...(amb.pisos||[])].forEach(s=>{
                if(!s.ativa)return;
                const r=calcSuperficieCeramica(s);
                const ac=s.argamassaTipo||'AC1';
                acTotais[ac]=(acTotais[ac]||0)+r.argaKg;
                rejTotal+=r.rejunteKg;
              });
            });
            const tr=(item,qtd,un,obs)=>`<tr style="border-bottom:1px solid #eee;">
              <td style="padding:10px 14px;font-size:14px;font-weight:600;">${item}</td>
              <td style="padding:10px 14px;font-size:20px;font-weight:800;color:var(--primary);text-align:right;">${qtd}</td>
              <td style="padding:10px 14px;font-size:14px;font-weight:600;">${un}</td>
              <td style="padding:10px 14px;font-size:11px;color:var(--muted);">${obs}</td>
            </tr>`;
            const acLinhas=Object.entries(acTotais).sort(([a],[b])=>a.localeCompare(b))
              .map(([ac,kg])=>tr(`Argamassa ${ac}`,Math.ceil(kg/20),'sacos 20kg',`${kg} kg total · ~${fmtDec(kg/5.5,1)} m²`)).join('');
            return `
              <div style="margin-top:28px;border:2px solid var(--primary);border-radius:10px;overflow:hidden;page-break-inside:avoid;">
                <div style="background:var(--primary);color:white;padding:10px 16px;font-size:15px;font-weight:800;">🛒 RESUMO DE COMPRAS</div>
                <table style="width:100%;border-collapse:collapse;">
                  <tbody>
                    ${acLinhas}
                    ${tr('Rejunte',Math.ceil(rejTotal),'kg',`~${Math.ceil(rejTotal/5)} sacos de 5kg`)}
                  </tbody>
                </table>
              </div>`;
          })()}

          <div style="margin-top:12px;font-size:10px;color:var(--muted);border-top:1px solid var(--border);padding-top:8px;">
            Consumo argamassa: 5,5 kg/m² — base campo (saco 20kg rende 3,5–4,0 m²). Editável por superfície. Valores estimados.
          </div>
        </div>
      </div>
    </div>`;
}

  const lista = (state.modal.data && state.modal.data.lista) || [];

    try {
      const d = new Date(iso);
      return d.toLocaleDateString('pt-BR') + ' às ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

  return `

      <div class="modal" onclick="event.stopPropagation()">

        <div class="modal-body">

// Inicializa o canvas de assinatura (touch + mouse). Chamada após o modal entrar no DOM.
function setupSignatureCanvas() {
  const canvas = document.getElementById('sigCanvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#0F1E33';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let drawing = false;
  let lastX = 0, lastY = 0;
  // Marca que o canvas teve algum desenho (pra validar no salvar)
  canvas._temDesenho = false;

  function getCoords(e) {
    const rect = canvas.getBoundingClientRect();
    let clientX, clientY;
    if (e.touches && e.touches[0]) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
    else if (e.changedTouches && e.changedTouches[0]) { clientX = e.changedTouches[0].clientX; clientY = e.changedTouches[0].clientY; }
    else { clientX = e.clientX; clientY = e.clientY; }
    const x = (clientX - rect.left) * canvas.width / rect.width;
    const y = (clientY - rect.top) * canvas.height / rect.height;
    return { x, y };
  }
  function start(e) {
    e.preventDefault();
    drawing = true;
    const c = getCoords(e);
    lastX = c.x; lastY = c.y;
  }
  function move(e) {
    if (!drawing) return;
    e.preventDefault();
    const c = getCoords(e);
    ctx.beginPath();
    ctx.moveTo(lastX, lastY);
    ctx.lineTo(c.x, c.y);
    ctx.stroke();
    lastX = c.x; lastY = c.y;
    canvas._temDesenho = true;
  }
  function stop(e) { if (e) e.preventDefault(); drawing = false; }

  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  canvas.addEventListener('mouseup', stop);
  canvas.addEventListener('mouseleave', stop);
  canvas.addEventListener('touchstart', start, { passive: false });
  canvas.addEventListener('touchmove', move, { passive: false });
  canvas.addEventListener('touchend', stop, { passive: false });
}

function modalEditarLeitura() {
  const d = state.modal.data;
  const fissura = state.fissuraAtual;
  const limite = state.laudoAtual ? limiteCAA(state.laudoAtual.dadosObra?.caa) : 0.30;

  const paqNum = (d.paquimetro !== '' && d.paquimetro != null) ? Number(d.paquimetro) : null;
  const medNum = (d.medidor !== '' && d.medidor != null) ? Number(d.medidor) : null;
  const classe = (paqNum !== null && paqNum > 0) ? classificarFissura(paqNum) : null;
  const acimaLimite = paqNum !== null && paqNum > limite;

  // Calcula deltas em tempo real comparando com a leitura anterior (ou marco zero se primeira)
  let prevPaq = null, prevMed = null;
  if (fissura && fissura.leituras && fissura.leituras.length > 0) {
    const arr = fissura.leituras;
    let prevLeitura = null;
    if (d.id) {
      const idx = arr.findIndex(l => l.id === d.id);
      if (idx > 0) prevLeitura = arr[idx - 1];
    } else {
      prevLeitura = arr[arr.length - 1];
    }
    if (prevLeitura) {
      prevPaq = paquimetroDeLeitura(prevLeitura);
      prevMed = medidorDeLeitura(prevLeitura);
    }
  }
  const paqRef = prevPaq !== null ? prevPaq : (fissura ? paquimetroInicialDeFissura(fissura) : null);
  const medRef = prevMed !== null ? prevMed : (fissura ? medidorInicialDeFissura(fissura) : null);

  const dPaq = (paqNum !== null && paqRef !== null) ? (paqNum - paqRef) : null;
  const dMed = (medNum !== null && medRef !== null) ? (medNum - medRef) : null;
  const dPaqAlerta = dPaq !== null && Math.abs(dPaq) > 0.10;
  const dMedAlerta = dMed !== null && Math.abs(dMed) > 0.10;

  const divergencia = (paqNum !== null && medNum !== null) ? Math.abs(paqNum - medNum) : null;
  const divAlerta = divergencia !== null && divergencia > 0.15;

  return `
    <div class="modal-overlay" onclick="actions.fecharModal()">
      <div class="modal modal-wide" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-title">${d.id ? 'Editar leitura' : 'Nova leitura periódica'}</div>
          <button class="modal-close" onclick="actions.fecharModal()">${ICON.x}</button>
        </div>
        <div class="modal-body">
          ${fissura ? `
            <div style="background: #F9FAFB; padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px;">
              <strong>${esc(fissura.codigo)}</strong> — ${esc(fissura.local)}<br>
              <span style="font-size: 12px; color: var(--muted);">
                Marco zero: paquímetro ${(paquimetroInicialDeFissura(fissura) ?? 0).toFixed(2)} mm${medidorInicialDeFissura(fissura) !== null ? ` • medidor ${medidorInicialDeFissura(fissura).toFixed(2)} mm` : ''} • Limite NBR: ${limite.toFixed(2)} mm
              </span>
            </div>
          ` : ''}

          <div class="field">
            <label>Data da leitura <span class="req">*</span></label>
            <input type="date" value="${esc(d.dataLeitura)}" oninput="actions.updateLeituraForm('dataLeitura', this.value)">
          </div>

          <!-- ============ MEDIÇÕES (3 instrumentos) ============ -->
          <div class="medicoes-bloco">
            <div class="medicoes-titulo">📏 Medições desta leitura</div>
            <div class="medicoes-sub">Preencha ao menos UM dos 3 instrumentos. O paquímetro é o de referência da NBR (largura absoluta).</div>

            <div class="row" style="gap: 8px; margin-top: 10px;">
              <div class="field" style="flex: 1;">
                <label>Paquímetro (mm)</label>
                <input type="number" step="0.01" min="0" placeholder="0.00" value="${esc(d.paquimetro)}" oninput="actions.updateLeituraForm('paquimetro', this.value);" onblur="render();">
                <div class="medicoes-instrumento-label">Largura absoluta</div>
                ${classe ? `<div style="font-size: 11px; margin-top: 4px; color: ${acimaLimite ? 'var(--danger)' : classe.cor}; font-weight: 600;">${acimaLimite ? '⚠ ACIMA DO LIMITE • ' : '● '}${classe.nome}</div>` : ''}
                ${dPaq !== null ? `<div style="font-size: 11px; margin-top: 4px; color: ${dPaqAlerta ? 'var(--danger)' : 'var(--muted)'}; font-weight: 600;">Δ ${dPaq > 0 ? '+' : ''}${dPaq.toFixed(2)} mm${dPaqAlerta ? ' ⚠' : ''}</div>` : ''}
              </div>
              <div class="field" style="flex: 1;">
                <label>Medidor de fissuras (mm)</label>
                <input type="number" step="0.01" min="0" placeholder="0.00" value="${esc(d.medidor)}" oninput="actions.updateLeituraForm('medidor', this.value);" onblur="render();">
                <div class="medicoes-instrumento-label">Deslocamento na régua/comparador</div>
                ${dMed !== null ? `<div style="font-size: 11px; margin-top: 4px; color: ${dMedAlerta ? 'var(--danger)' : 'var(--muted)'}; font-weight: 600;">Δ ${dMed > 0 ? '+' : ''}${dMed.toFixed(2)} mm${dMedAlerta ? ' ⚠' : ''}</div>` : ''}
              </div>
            </div>

            ${divAlerta ? `<div style="font-size: 11px; color: var(--danger); margin-top: 8px; padding: 6px 10px; background: #FEE2E2; border-radius: 6px;">⚠ Divergência entre paquímetro e medidor: ${divergencia.toFixed(2)} mm > 0,15 mm — verifique calibração do instrumento.</div>` : ''}

            <div class="row" style="gap: 8px; margin-top: 10px;">
              <div class="field" style="flex: 1; margin: 0;">
                <label>Estado do selo de gesso</label>
                <select onchange="actions.updateLeituraForm('estadoSelo', this.value)">
                  <option value="" ${!d.estadoSelo ? 'selected' : ''}>— Não verificado —</option>
                  ${ESTADOS_SELO.map(e => `<option value="${esc(e)}" ${d.estadoSelo === e ? 'selected' : ''}>${esc(e)}</option>`).join('')}
                </select>
                <div class="medicoes-instrumento-label">Verificação qualitativa da atividade</div>
              </div>
              <div class="field" style="flex: 1; margin: 0;">
                <label>Propagação (cm)</label>
                <input type="number" step="0.1" min="0" value="${esc(d.propagacao)}" oninput="actions.updateLeituraForm('propagacao', this.value)">
                <div class="medicoes-instrumento-label">Aumento de comprimento</div>
              </div>
            </div>
          </div>
          <!-- /MEDIÇÕES -->

          <div class="field">
            <label>Comprimento atual (m)</label>
            <input type="number" step="0.01" min="0" value="${esc(d.comprimento)}" oninput="actions.updateLeituraForm('comprimento', this.value)">
          </div>

          <div class="field">
            <label>Inspetor</label>
            <input type="text" value="${esc(d.inspetor)}" oninput="actions.updateLeituraForm('inspetor', this.value)">
          </div>

          <div class="field">
            <label>Observações</label>
            <textarea rows="2" placeholder="Ex: Visita após chuva forte, selo trincado..." oninput="actions.updateLeituraForm('observacoes', this.value)">${esc(d.observacoes)}</textarea>
          </div>

          <div class="field">
            <label>Fotos da leitura (${(d.fotos || []).length})</label>
            <input type="file" accept="image/*" capture="environment" multiple onchange="actions.adicionarFotoLeitura(this)">
            ${(d.fotos || []).length > 0 ? `
              <div class="fotos-grid" style="margin-top: 8px;">
                ${d.fotos.map(foto => `
                  <div class="foto-preview">
                    <img src="${fotoSrc(foto)}" alt="Leitura">
                    <button class="foto-remover" onclick="actions.removerFotoLeitura('${foto.id}')">${ICON.x}</button>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>

          <div class="row" style="gap: 8px; margin-top: 16px;">
            <button class="btn btn-ghost" onclick="actions.fecharModal()" style="flex: 1;">Cancelar</button>
            <button class="btn btn-primary" onclick="actions.salvarLeitura()" style="flex: 2;">${ICON.check} Registrar leitura</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function modalRegistrarPagamento() {
  const d = state.modal.data;
  const orc = state.orcamentos.find(o => o.id === d.orcId);
  const parcela = orc ? (orc.parcelas || []).find(p => p.id === d.parcelaId) : null;
  if (!orc || !parcela) return '';
  const ehEntrada = parcela.tipo === 'entrada';
  const pagoAnterior = parcelaTotalPago(parcela);
  const valorAtual = Number(d.valor) || 0;

  // Pra ENTRADA: contexto da própria parcela (tem teto)
  // Pra MEDIÇÃO: contexto do contrato inteiro (sem teto na parcela, teto no total)
  const totalContrato = calcTotalOrc(orc);
  const pagoContrato = (orc.parcelas || []).reduce((s, p) => s + parcelaTotalPago(p), 0);
  const saldoContrato = round2(Math.max(0, totalContrato - pagoContrato));
  const saldoContratoApos = round2(saldoContrato - valorAtual);

  const previsto = Number(parcela.valorPrevisto || 0);
  const saldoEntrada = ehEntrada ? parcelaSaldo(parcela) : 0;
  const saldoEntradaApos = round2(saldoEntrada - valorAtual);

  const titulo = ehEntrada
    ? 'Registrar pagamento da entrada'
    : (pagoAnterior > 0 ? 'Adicionar pagamento à medição' : 'Registrar medição');

  // Bloco de contexto
  let contexto;
  if (ehEntrada) {
    contexto = `
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; font-size: 13px;">
        <div><span style="color: var(--muted);">Previsto:</span> <strong>${fmtBRL(previsto)}</strong></div>
        <div><span style="color: var(--muted);">Já pago:</span> <strong style="color: var(--success);">${fmtBRL(pagoAnterior)}</strong></div>
        <div><span style="color: var(--muted);">Saldo:</span> <strong style="color: var(--secondary);">${fmtBRL(saldoEntrada)}</strong></div>
        <div><span style="color: var(--muted);">Vencimento:</span> <strong>${fmtData(parcela.dataPrevista) || '—'}</strong></div>
      </div>
    `;
  } else {
    contexto = `
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; font-size: 13px;">
        <div><span style="color: var(--muted);">Total do contrato:</span> <strong>${fmtBRL(totalContrato)}</strong></div>
        <div><span style="color: var(--muted);">Já recebido:</span> <strong style="color: var(--success);">${fmtBRL(pagoContrato)}</strong></div>
        <div><span style="color: var(--muted);">Saldo do contrato:</span> <strong style="color: var(--secondary);">${fmtBRL(saldoContrato)}</strong></div>
        <div><span style="color: var(--muted);">Leitura:</span> <strong>${fmtData(parcela.dataLeitura) || fmtData(parcela.dataPrevista) || '—'}</strong></div>
      </div>
      ${pagoAnterior > 0 ? `<div style="margin-top: 8px; font-size: 12px; color: var(--muted);">Esta medição já tem ${fmtBRL(pagoAnterior)} registrado(s).</div>` : ''}
    `;
  }

  // Dica abaixo do campo de valor
  let dica = '';
  if (ehEntrada) {
    if (saldoEntradaApos > 0.01) dica = `Restará ${fmtBRL(saldoEntradaApos)} da entrada.`;
    else if (Math.abs(saldoEntradaApos) <= 0.01) dica = `✓ Entrada ficará quitada.`;
    else dica = `⚠ Valor maior que o saldo da entrada (sobra ${fmtBRL(-saldoEntradaApos)}).`;
  } else {
    if (valorAtual <= 0) dica = `Digite o valor apurado nesta quinzena (laje custou mais, elétrica custou menos — você define agora).`;
    else if (saldoContratoApos > 0.01) dica = `Restará ${fmtBRL(saldoContratoApos)} do contrato após este pagamento.`;
    else if (Math.abs(saldoContratoApos) <= 0.01) dica = `✓ Contrato ficará quitado com este pagamento.`;
    else dica = `⚠ Valor ultrapassa o saldo do contrato em ${fmtBRL(-saldoContratoApos)}.`;
  }
  const dicaCor = (ehEntrada ? saldoEntradaApos < -0.01 : saldoContratoApos < -0.01) ? 'var(--danger)' : 'var(--muted)';

  return `
    <div class="modal-overlay" onclick="actions.fecharModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-title">${titulo}</div>
          <button class="modal-close" onclick="actions.fecharModal()">${ICON.x}</button>
        </div>
        <div class="modal-body">
          <div class="card" style="background: #F9FAFB; padding: 12px; margin-bottom: 16px;">
            <div style="font-size: 13px; color: var(--muted);">${esc(orc.cliente?.nome || '—')} • Nº ${esc(orc.numero)}</div>
            <div style="font-weight: 600; margin-top: 2px;">${esc(parcela.descricao)}</div>
            ${contexto}
          </div>

          <div class="field">
            <label>${ehEntrada ? 'Valor recebido' : 'Valor desta medição'}</label>
            <input type="number" step="0.01" min="0" value="${valorAtual || ''}" placeholder="${ehEntrada ? '' : 'R$ 0,00'}" oninput="actions.updatePagamentoForm('valor', this.value);" onblur="render();" autofocus>
            <div style="font-size: 12px; margin-top: 4px; color: ${dicaCor};">${dica}</div>
          </div>

          <div class="field">
            <label>Data do pagamento</label>
            <input type="date" value="${esc(d.data)}" oninput="actions.updatePagamentoForm('data', this.value)">
          </div>

          <div class="field">
            <label>Forma / observação (opcional)</label>
            <input type="text" placeholder="${ehEntrada ? 'Ex: PIX, dinheiro, cheque...' : 'Ex: laje concretada / elétrica do 2º pav. / PIX'}" value="${esc(d.observacao || '')}" oninput="actions.updatePagamentoForm('observacao', this.value)">
          </div>

          <div class="row" style="gap: 8px; margin-top: 12px;">
            <button class="btn btn-ghost" onclick="actions.fecharModal()" style="flex: 1;">Cancelar</button>
            <button class="btn btn-primary" onclick="actions.salvarPagamento()" style="flex: 2;">${ICON.check} Confirmar</button>
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderCatalogoSelectorListHTML() {
  const f = state.catalogoSelectorFiltro;
  const tipoFiltro = f.tipo || 'todos';
  const filtrados = state.catalogo.filter(i => {
    if (tipoFiltro !== 'todos' && (i.tipo || 'servico') !== tipoFiltro) return false;
    if (f.cat !== 'todas' && i.cat !== f.cat) return false;
    if (f.busca) {
      const b = f.busca.toLowerCase();
      return i.desc.toLowerCase().includes(b) || i.cat.toLowerCase().includes(b);
    }
    return true;
  });
  if (filtrados.length === 0) return '<div class="empty"><div class="empty-msg">Nenhum item encontrado.</div></div>';
  return filtrados.map(it => {
    const isMat = (it.tipo || 'servico') === 'material';
    return `
    <button class="cat-item" onclick="actions.addItem('${it.id}')">
      <div class="cat-item-head">
        <div style="flex: 1; min-width: 0;">
          <div class="cat-categoria">${esc(it.cat)}${isMat ? ' <span style="color: var(--info);">• MATERIAL</span>' : ''}</div>
          <div class="cat-desc">${esc(it.desc)}</div>
          <div class="cat-unidade">Unidade: ${esc(it.un)}</div>
        </div>
        <div class="cat-valor">${fmtBRL(it.val)}</div>
      </div>
    </button>
    `;
  }).join('');
}

function renderCatalogoSelectorList() {
  const el = document.getElementById('cat-selector-list');
  if (el) el.innerHTML = renderCatalogoSelectorListHTML();
}

// ============ LIGHTBOX DE FOTOS ============
// Abre qualquer foto em tela cheia ao clicar.
// Funciona em foto-thumb (grid) e foto-preview (modal de edição).

function abrirLightbox(src, caption) {
  // Remove lightbox anterior se houver
  const anterior = document.getElementById('ei-lightbox');
  if (anterior) anterior.remove();

  const overlay = document.createElement('div');
  overlay.id = 'ei-lightbox';
  overlay.className = 'lightbox-overlay no-print';
  overlay.innerHTML = `
    <button class="lightbox-close" onclick="fecharLightbox()" title="Fechar">✕</button>
    <img src="${src}" class="lightbox-img" alt="Foto ampliada" onclick="event.stopPropagation()">
    ${caption ? `<div class="lightbox-caption">${caption}</div>` : ''}
  `;
  // Clique fora da imagem fecha
  overlay.addEventListener('click', fecharLightbox);
  document.body.appendChild(overlay);

  // ESC também fecha
  document.addEventListener('keydown', _lightboxEscHandler);
}

function fecharLightbox() {
  const lb = document.getElementById('ei-lightbox');
  if (lb) lb.remove();
  document.removeEventListener('keydown', _lightboxEscHandler);
}

function _lightboxEscHandler(e) {
  if (e.key === 'Escape') fecharLightbox();
}

window.abrirLightbox = abrirLightbox;
window.fecharLightbox = fecharLightbox;

// Listener global: clique em qualquer imagem foto-thumb ou foto-preview abre lightbox
document.addEventListener('click', function(e) {
  const img = e.target.closest('.foto-thumb, .foto-preview img, .lightbox-img-thumb');
  if (img && img.src && !img.src.startsWith('data:image/svg')) {
    e.stopPropagation();
    const caption = img.alt || img.closest('[data-caption]')?.dataset?.caption || '';
    abrirLightbox(img.src, caption);
    return;
  }

  // Listener original do catálogo
  const btn = e.target.closest('[data-cattipo]');
  if (btn && window.actions && window.actions.catalogoTipo) {
    e.preventDefault();
    window.actions.catalogoTipo(btn.dataset.cattipo);
  }
});

/* ============================================================
   BOOT — inicialização das fotos (IndexedDB) e migração legado
   ============================================================ */
async function migrarFotosLegado() {
  // Detecta fotos ainda embutidas (.data) dentro dos laudos no localStorage
  // — resquício das versões antigas — e as move para o IndexedDB, deixando
  // no localStorage apenas a referência leve. Roda uma única vez por aparelho.
  let migradas = 0;
  const laudos = state.laudos || [];
  for (const l of laudos) {
    for (const f of (l.fissuras || [])) {
      for (const ft of (f.fotosMarcoZero || [])) {
        if (ft && ft.data) {
          if (!ft.id) ft.id = uid();
          FOTO_CACHE[ft.id] = ft.data;
          await FotoDB.put(ft.id, ft.data);
          delete ft.data;
          migradas++;
        }
      }
      for (const le of (f.leituras || [])) {
        for (const ft of (le.fotos || [])) {
          if (ft && ft.data) {
            if (!ft.id) ft.id = uid();
            FOTO_CACHE[ft.id] = ft.data;
            await FotoDB.put(ft.id, ft.data);
            delete ft.data;
            migradas++;
          }
        }
      }
    }
  }
  if (migradas > 0) {
    // Regrava os laudos SEM as fotos → libera o localStorage de uma vez.
    persist('laudos', laudos);
    console.log('✓ ' + migradas + ' foto(s) migrada(s) do localStorage para o IndexedDB.');
  }
  return migradas;
}

async function initApp() {
  try {
    // 1) Carrega todas as fotos do IndexedDB para o cache em memória.
    const todas = await FotoDB.getAll();
    Object.assign(FOTO_CACHE, todas);
    // 2) Migra qualquer foto legada que ainda esteja no localStorage.
    const n = await migrarFotosLegado();
    if (n > 0) showToast(n + ' foto(s) organizada(s) no novo armazenamento');
  } catch (err) {
    console.warn('Falha ao iniciar armazenamento de fotos:', err);
    // App continua funcionando; fotos legadas com .data ainda exibem via fotoSrc().
  }
  render();
  // 3) Verifica se é hora de lembrar de um backup externo (a cada LEMBRETE_DIAS).
  //    Roda depois do render inicial para não atrapalhar a abertura do app.
  setTimeout(() => { try { checarLembreteBackup(); render(); } catch (e) {} }, 1200);
}

initApp();
</script>

<!-- ===== SERVICE WORKER (PWA / offline-first) ===== -->
<script>
// Registra o service worker pra habilitar funcionamento offline e instalação como app.
// Funciona apenas em HTTPS (e em localhost pra testes).
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function() {
    navigator.serviceWorker.register('service-worker.js')
      .then(function(reg) {
        console.log('✓ Service Worker registrado:', reg.scope);
        // Detecta atualizações em background
        reg.addEventListener('updatefound', function() {
          const newWorker = reg.installing;
          if (newWorker) {
            newWorker.addEventListener('statechange', function() {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                // Nova versão disponível - usuário já tem o app instalado
                console.log('↻ Nova versão do app disponível. Recarregue para atualizar.');
              }
            });
          }
        });
      })
      .catch(function(err) {
        console.log('Service Worker não registrado (provavelmente HTTP local):', err.message);
      });
  });
}

// Prompt de instalação (Chrome/Edge no Android)
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', function(e) {
  e.preventDefault();
  deferredInstallPrompt = e;
  // Disponibiliza globalmente caso o app queira oferecer botão "Instalar"
  window._canInstallPWA = true;
});
window.addEventListener('appinstalled', function() {
  console.log('✓ App instalado na tela inicial');
  deferredInstallPrompt = null;
  window._canInstallPWA = false;
});
</script>
