// ==================== ALVENARIA E REVESTIMENTO ====================
// Dimensões em metros (comprimento × altura × espessura)
const BLOCOS_ALV = {
  'ceramico_9':    { nome: 'Cerâmico vedação 9×19×19',    c:0.19, a:0.19, e:0.09,  tipo:'vedação',   temCanaleta:false },
  'ceramico_115':  { nome: 'Cerâmico vedação 11,5×19×19', c:0.19, a:0.19, e:0.115, tipo:'vedação',   temCanaleta:false },
  'ceramico_14':   { nome: 'Cerâmico vedação 14×19×29',   c:0.29, a:0.19, e:0.14,  tipo:'vedação',   temCanaleta:true  },
  'estrutural_14': { nome: 'Cerâmico estrutural 14×19×29', c:0.29, a:0.19, e:0.14, tipo:'estrutural', temCanaleta:true  },
  'concreto_14':   { nome: 'Concreto 14×19×39',           c:0.39, a:0.19, e:0.14,  tipo:'vedação',   temCanaleta:true  },
  'concreto_19':   { nome: 'Concreto estrutural 19×19×39', c:0.39, a:0.19, e:0.19, tipo:'estrutural', temCanaleta:true  },
};

// Blocos por m² considerando a junta (módulo = bloco + junta nas duas direções)
function blocosPorM2Alv(bloco, junta) {
  const areaModulo = (bloco.c + junta) * (bloco.a + junta);
  return areaModulo > 0 ? 1 / areaModulo : 0;
}

// Converte volume de argamassa PRONTA em sacos de cimento (50 kg) + m³ de areia.
// traço 1:tracoAreia (cimento:areia) em volume. Os materiais secos rendem menos
// argamassa que a soma dos volumes (fator ~0,75). Saco 50 kg ≈ 0,0347 m³.
function argamassaTraco(volumePronta, tracoAreia) {
  const volMateriais = volumePronta / 0.75;   // volume seco necessário
  const partes = 1 + tracoAreia;
  const volCimento = volMateriais / partes;
  const volAreia = volMateriais * tracoAreia / partes;
  return {
    sacosCimento: Math.ceil(volCimento / 0.0347),
    volAreia: volAreia,
    volCimento
  };
}

function calcAlvenaria(d) {
  const bloco = BLOCOS_ALV[d.bloco] || BLOCOS_ALV['ceramico_9'];
  const junta = nnum(d.junta) || 0.012;

  let areaBruta = d.modo === 'direta'
    ? nnum(d.areaDireta)
    : nnum(d.comprimento) * nnum(d.altura);

  let areaPilares = 0;
  (d.pilares || []).forEach(p => { areaPilares += nnum(p.larg) * nnum(p.alt) * (nnum(p.qtd) || 1); });
  let areaVaos = 0;
  (d.vaos || []).forEach(v => { areaVaos += nnum(v.larg) * nnum(v.alt) * (nnum(v.qtd) || 1); });

  const areaLiquida = Math.max(0, areaBruta - areaPilares - areaVaos);
  const bpm2 = blocosPorM2Alv(bloco, junta);
  const perda = nnum(d.perda) || 5;
  const qtdBlocos = Math.ceil(areaLiquida * bpm2 * (1 + perda / 100));

  const fatorArg = nnum(d.fatorArg) || 0.02;
  const volArg = consumoArgM2(bloco, fatorArg) * areaLiquida * (1 + perda / 100);
  const tracoAssent = nnum(d.tracoAssent) || 5;
  const arg = argamassaTraco(volArg, tracoAssent);

  // Canaleta (por metro linear)
  const metrosCanaleta = nnum(d.metrosCanaleta);
  const canaletasPorM = bloco.c > 0 ? 1 / bloco.c : 0;
  const qtdCanaletas = metrosCanaleta > 0
    ? Math.ceil(metrosCanaleta * canaletasPorM * (1 + perda / 100)) : 0;

  return {
    bloco, junta, areaBruta, areaPilares, areaVaos, areaLiquida, bpm2, qtdBlocos, perda,
    volArg, tracoAssent, ...arg,
    metrosCanaleta, canaletasPorM, qtdCanaletas
  };
}

function calcRevestimento(d) {
  const area = nnum(d.areaRev);
  const defs = [
    { key:'chapisco', nome:'Chapisco', esp:(nnum(d.espChapisco)||5)/1000, traco:nnum(d.tracoChapisco)||3, usar:d.usarChapisco !== false },
    { key:'emboco',   nome:'Emboço',   esp:(nnum(d.espEmboco)||20)/1000,  traco:nnum(d.tracoEmboco)||6,  usar:d.usarEmboco !== false },
    { key:'reboco',   nome:'Reboco',   esp:(nnum(d.espReboco)||5)/1000,   traco:nnum(d.tracoReboco)||5,  usar:d.usarReboco !== false },
  ];
  const perda = nnum(d.perdaRev) || 10;
  const camadas = [];
  defs.forEach(c => {
    if (!c.usar) return;
    const vol = area * c.esp * (1 + perda / 100);
    camadas.push({ ...c, vol, ...argamassaTraco(vol, c.traco) });
  });
  return { area, camadas, perda };
}

function calcContrapiso(d) {
  const area = nnum(d.areaCp);
  const esp = (nnum(d.espCp) || 30) / 1000;
  const traco = nnum(d.tracoCp) || 4;
  const perda = nnum(d.perdaCp) || 5;
  const vol = area * esp * (1 + perda / 100);
  return { area, esp, traco, vol, perda, ...argamassaTraco(vol, traco) };
}

// Volume de argamassa de assentamento por m² de parede.
// Fonte: a bibliografia diverge muito (SINAPI 0,01 teórico vs prática 0,05),
// pois o consumo real varia com furos do bloco, junta vertical, perda e mão de
// obra. Por isso adotamos um fator editável por m², escalonado pela espessura
// do bloco (junta vertical mais profunda em bloco mais largo), que o usuário
// calibra com a própria obra. Ponto de partida: 0,02 m³/m² para bloco de 9 cm.
function consumoArgM2(bloco, fatorBase) {
  const base = fatorBase > 0 ? fatorBase : 0.02;
  // escalona pela espessura relativa ao bloco de referência (9 cm)
  return base * (bloco.e / 0.09);
}

// ==================== DRYWALL (parede e forro) ====================
// Base: NBR 15758:2025, manuais Placo/Knauf/Gypsum
const PLACAS_DRYWALL = {
  '120x180': { nome: '1,20 × 1,80 m', larg: 1.20, alt: 1.80, area: 2.16 },
  '120x240': { nome: '1,20 × 2,40 m', larg: 1.20, alt: 2.40, area: 2.88 },
  '60x120':  { nome: '0,60 × 1,20 m', larg: 0.60, alt: 1.20, area: 0.72 },
};

function calcParedeDrywall(d) {
  const comp = d.modo === 'direta' ? 0 : nnum(d.comprimento);
  const altura = nnum(d.altura) || 2.80;
  const areaFace = d.modo === 'direta' ? nnum(d.areaDireta) : comp * altura;
  const espMontante = nnum(d.espMontante) || (d.ambiente === 'umido' ? 0.40 : 0.60);
  const perda = nnum(d.perda) || 10;
  const compEfetivo = d.modo === 'direta' && altura > 0 ? areaFace / altura : comp;

  const guiaML = compEfetivo * 2;
  const guiaBarras = Math.ceil(guiaML / 3 * (1 + perda / 100));
  const nMontantes = Math.ceil(compEfetivo / espMontante) + 1;
  const montanteBarras = Math.ceil(nMontantes * Math.ceil(altura / 3) * (1 + perda / 100));

  const placa = PLACAS_DRYWALL[d.placa] || PLACAS_DRYWALL['120x180'];
  const areaTotal = areaFace * 2;
  const nPlacas = Math.ceil(areaTotal / placa.area * (1 + perda / 100));

  const parafPorM2 = nnum(d.parafusoM2) || 25;
  const parafusosPlaca = Math.ceil(areaTotal * parafPorM2);
  const parafusosMetal = nMontantes * 4;

  const fitaFator = nnum(d.fitaFator) || 2;
  const massaFator = nnum(d.massaFator) || 0.5;
  const fitaML = Math.ceil(areaTotal * fitaFator);
  const massaKg = Math.ceil(areaTotal * massaFator);
  const laM2 = d.isolamento ? Math.ceil(areaFace * (1 + perda / 100)) : 0;

  return {
    tipo: 'parede', areaFace, areaTotal, espMontante, altura, compEfetivo,
    guiaML, guiaBarras, nMontantes, montanteBarras,
    placa, nPlacas, parafusosPlaca, parafusosMetal, fitaML, massaKg, laM2, perda
  };
}

function calcForroDrywall(d) {
  const area = nnum(d.areaForro);
  const perimetro = nnum(d.perimetro) || 0;
  const perda = nnum(d.perda) || 10;
  const placa = PLACAS_DRYWALL[d.placa] || PLACAS_DRYWALL['120x180'];
  const nPlacas = Math.ceil(area / placa.area * (1 + perda / 100));
  const canaletaML = Math.ceil(area / 0.60 * (1 + perda / 100));
  const canaletaBarras = Math.ceil(canaletaML / 3);
  const nTirantes = Math.ceil(area * 1.7);
  const cantoneiraML = perimetro > 0 ? Math.ceil(perimetro * (1 + perda / 100)) : 0;
  const parafPorM2 = nnum(d.parafusoM2) || 25;
  const parafusos = Math.ceil(area * parafPorM2);
  const fitaFator = nnum(d.fitaFator) || 2;
  const massaFator = nnum(d.massaFator) || 0.5;
  const fitaML = Math.ceil(area * fitaFator);
  const massaKg = Math.ceil(area * massaFator);
  return {
    tipo: 'forro', area, placa, nPlacas, canaletaML, canaletaBarras,
    nTirantes, cantoneiraML, parafusos, fitaML, massaKg, perda
  };
}

// ==================== REVESTIMENTO CERÂMICO ====================
// Base: NBR 14081 (argamassa colante AC I/II/III)
const AC_FATORES = { 'AC1': 5.5, 'AC2': 5.5, 'AC3': 5.5 }; // 5,5 kg/m² (saco 20kg rende ~3,5-4,0 m² em obra)
const TIPO_AMBIENTE_AC = { 'seco':'AC1', 'pia':'AC2', 'box':'AC3', 'varanda':'AC3', 'outro':'AC1' };
const TIPO_AMBIENTE_LABEL = { 'seco':'Parede seca', 'pia':'Parede pia/cozinha', 'box':'Box/área molhada', 'varanda':'Varanda externa', 'outro':'Outro' };

// Calcula uma superfície individual (parede ou piso)
function calcSuperficieCeramica(s) {
  if (!s || !s.ativa) return { area:0, areaComPerda:0, nCaixas:0, argaKg:0, rejunteKg:0 };
  const perda    = nnum(s.perda) || 10;
  const acTipo   = s.argamassaTipo || 'AC1';
  const acFator  = nnum(s.argaFator) || AC_FATORES[acTipo] || 5.5;
  const rejFator = nnum(s.rejunteFator) || 0.5;
  const area     = s.modo === 'direta' ? nnum(s.areaDireta) : nnum(s.larg) * nnum(s.alt);
  const areaDesc = (s.descontos||[]).reduce((a,d) => a + nnum(d.larg)*nnum(d.alt), 0);
  const areaLiq  = Math.max(0, area - areaDesc);
  const areaComPerda = areaLiq * (1 + perda/100);
  const m2Cx    = nnum(s.m2PorCaixa) || 0;
  const nCaixas = m2Cx > 0 ? Math.ceil(areaComPerda / m2Cx) : 0;
  const argaKg    = Math.ceil(areaLiq * acFator);
  const rejunteKg = Math.ceil(areaLiq * rejFator);
  return { area:areaLiq, areaComPerda, nCaixas, argaKg, acTipo, acFator, rejunteKg, perda };
}

// Soma superfícies de uma lista
function calcListaSuperficies(lista) {
  return (lista||[]).filter(s=>s.ativa).reduce((t,s) => {
    const r = calcSuperficieCeramica(s);
    return { area:t.area+r.area, nCaixas:t.nCaixas+r.nCaixas,
             argaKg:t.argaKg+r.argaKg, rejunteKg:t.rejunteKg+r.rejunteKg };
  }, { area:0, nCaixas:0, argaKg:0, rejunteKg:0 });
}

// Total de um ambiente (paredes + piso)
function calcAmbienteTotal(amb) {
  const rev  = calcListaSuperficies(amb.revestimentos);
  const piso = calcListaSuperficies(amb.pisos);
  return { rev, piso,
    area:rev.area+piso.area, nCaixas:rev.nCaixas+piso.nCaixas,
    argaKg:rev.argaKg+piso.argaKg, rejunteKg:rev.rejunteKg+piso.rejunteKg };
}

// Total geral da medição
function calcMedicaoTotal(ambientes) {
  return (ambientes||[]).reduce((t,amb) => {
    const r = calcAmbienteTotal(amb);
    return { area:t.area+r.area, nCaixas:t.nCaixas+r.nCaixas,
             argaKg:t.argaKg+r.argaKg, rejunteKg:t.rejunteKg+r.rejunteKg };
  }, { area:0, nCaixas:0, argaKg:0, rejunteKg:0 });
}

// Comprimentos comerciais da fibrocimento (m)
const COMPRIMENTOS_FIBRO = [1.22, 1.53, 1.83, 2.13, 2.44];

// Fator de inclinação: converte área projetada em área real do plano.
function fatorInclinacao(iPct) {
  const ang = Math.atan(nnum(iPct) / 100);
  return 1 / Math.cos(ang);
}

// Rendimento da telha de fibrocimento conforme o comprimento escolhido.
function areaUtilFibro(comprimento, t) {
  return (nnum(comprimento) - t.recobLong) * t.larguraUtil;
}

function calcularTelhado(td) {
  const t = TIPOS_TELHA[td.tipo] || TIPOS_TELHA['colonial'];
  const incl = nnum(td.inclinacao);
  const fator = fatorInclinacao(incl);
  const ehFibro = td.tipo === 'eternit4' || td.tipo === 'eternit5';
  const ehPvc = td.tipo === 'pvc';

  // --- Geometria ---
  // Dimensões da projeção; para telhado de 2 águas a projeção é dividida.
  const nAguas = nnum(td.nAguas) || 2;
  let compProj = 0, largProj = 0, areaProjetada = 0, areaReal = 0;
  if (td.modo === 'direta') {
    areaReal = nnum(td.areaDireta);
    areaProjetada = areaReal / fator;
    // estima dimensões quadradas para o madeiramento
    compProj = Math.sqrt(areaProjetada);
    largProj = compProj;
  } else {
    compProj = nnum(td.comprimento);
    largProj = nnum(td.largura);
    areaProjetada = compProj * largProj;
    areaReal = areaProjetada * fator;
  }

  const perdaPct = nnum(td.perda);
  const areaComPerda = areaReal * (1 + perdaPct / 100);

  // --- Telhas ---
  let telhasM2 = 0, qtdTelhas = 0, pesoTotal = 0, compFibro = null;
  let areaUtil = 0, recobLong = 0, nApoios = 0;
  if (ehFibro) {
    compFibro = nnum(td.compFibro) || 2.44;
    recobLong = recobrimentoFibro(incl);
    areaUtil = (compFibro - recobLong) * t.larguraUtil;
    telhasM2 = areaUtil > 0 ? 1 / areaUtil : 0;
    qtdTelhas = Math.ceil(areaComPerda * telhasM2);
    nApoios = apoiosFibro(compFibro);
    const pesoUn = (t.pesosNominais && t.pesosNominais[compFibro]) || 0;
    pesoTotal = qtdTelhas * pesoUn;
  } else if (ehPvc) {
    // PVC: área útil tabelada pelo fabricante (já considera os recobrimentos)
    compFibro = nnum(td.compFibro) || 2.42;
    areaUtil = (t.areaUtilTabela && t.areaUtilTabela[compFibro]) || ((compFibro - 0.10) * t.larguraUtil);
    telhasM2 = areaUtil > 0 ? 1 / areaUtil : 0;
    qtdTelhas = Math.ceil(areaComPerda * telhasM2);
    // Apoios por telha = terças que a atravessam. Usa o comprimento útil
    // longitudinal (área útil ÷ largura útil), que já desconta as sobreposições.
    // Ex.: telha 2,42 m → 1,72/0,80 = 2,15 m útil → round(2,15/0,66)=3 vãos → 4 terças.
    const espPvc = nnum(td.espTerca) || t.espTerca;
    const utilLong = areaUtil / t.larguraUtil;
    nApoios = espPvc > 0 ? Math.max(2, Math.round(utilLong / espPvc) + 1) : 4;
    pesoTotal = qtdTelhas * ((t.pesosNominais && t.pesosNominais[compFibro]) || 0);
  } else {
    telhasM2 = td.tipo === 'personalizada' ? nnum(td.telhasM2Custom) : t.telhasM2;
    qtdTelhas = Math.ceil(areaComPerda * telhasM2);
    pesoTotal = qtdTelhas * (t.pesoTelha || 0);
  }

  // --- Madeiramento (por PEÇAS, não por área/espaçamento) ---
  // Comprimento da água (no plano inclinado) e largura da fachada.
  const compAgua = (largProj / nAguas) * fator;   // do beiral à cumeeira (real)
  const projAgua = largProj / nAguas;              // mesma extensão em planta
  const largFachada = compProj;                    // comprimento das terças
  const madeira = {};

  // Nº de peças: a prática de obra DILUI a sobra nos vãos existentes em vez
  // de acrescentar uma peça. Se sobram 30 cm, os vãos ficam pouco menores —
  // nunca se coloca uma peça extra só para a sobra. Daí o arredondamento
  // normal (round) e não para cima.
  // modo 'max': o espaçamento é um limite superior (vão livre de terça) —
  //   a sobra é diluída, podendo reduzir o vão. Arredonda normal.
  // modo 'min': o espaçamento é um mínimo de encaixe (galgo da ripa) —
  //   o vão real nunca pode ultrapassá-lo. Arredonda para cima.
  const contarPecas = (extensao, espacamento, modo = 'max') => {
    if (!(espacamento > 0)) return 0;
    const vaos = modo === 'min'
      ? Math.ceil(extensao / espacamento)
      : Math.round(extensao / espacamento);
    return Math.max(2, vaos + 1);
  };
  // Vão real após a diluição — usado para alertar se ultrapassa o máximo.
  const vaoReal = (extensao, espacamento, modo = 'max') => {
    const n = contarPecas(extensao, espacamento, modo) - 1;
    return n > 0 ? extensao / n : 0;
  };
  // Peças horizontais (terça e ripa) que caem na cumeeira são COMPARTILHADAS
  // pelas águas opostas — contar uma única vez. Telhado de 2 águas tem 1 cumeeira;
  // de 4 águas, a cumeeira principal também é única.
  const cumeeiraCompartilhada = nAguas >= 2 ? 1 : 0;

  if (t.usaRipa) {
    const espRipa = nnum(td.espRipa) || t.espRipa;
    const espCaibro = nnum(td.espCaibro) || t.espCaibro;
    const espTerca = nnum(td.espTerca) || t.espTerca;
    // Ripas: horizontais, ao longo da água; cada uma tem a largura da fachada
    madeira.nRipas = contarPecas(projAgua, espRipa, 'min') * nAguas - cumeeiraCompartilhada;
    madeira.ripaM = madeira.nRipas * largFachada;
    // Caibros: no sentido da inclinação — cada água tem os seus, não compartilham
    madeira.nCaibros = contarPecas(largFachada, espCaibro) * nAguas;
    madeira.caibroM = madeira.nCaibros * compAgua;
    // Terças: horizontais; a da cumeeira serve as duas águas
    madeira.nTercas = contarPecas(projAgua, espTerca) * nAguas - cumeeiraCompartilhada;
    madeira.tercaM = madeira.nTercas * largFachada;
    madeira.espRipa = espRipa; madeira.espCaibro = espCaibro; madeira.espTerca = espTerca;
  } else {
    const espTerca = nnum(td.espTerca) || t.espTerca;
    madeira.nTercas = contarPecas(projAgua, espTerca) * nAguas - cumeeiraCompartilhada;
    madeira.tercaM = madeira.nTercas * largFachada;
    madeira.espTerca = espTerca;
  }
  madeira.compAgua = compAgua;
  madeira.projAgua = projAgua;
  // vão real das terças após a diluição da sobra
  madeira.vaoRealTerca = vaoReal(projAgua, madeira.espTerca);
  if (madeira.espRipa) madeira.vaoRealRipa = vaoReal(projAgua, madeira.espRipa, 'min');
  madeira.largFachada = largFachada;

  // --- Acessórios ---
  const compCumeeira = nnum(td.cumeeira);
  let cumeeiras = 0;
  if (compCumeeira > 0) {
    cumeeiras = (ehFibro || ehPvc)
      ? Math.ceil(compCumeeira / (ehPvc ? 0.76 : 0.90))
      : Math.ceil(compCumeeira * 3);
  }
  // Parafusos: 2 pontos por apoio (2ª e 5ª crista) × nº de apoios
  // Fixações: 2 pontos por apoio (2ª e 5ª onda). O apoio do topo é
  // COMPARTILHADO com a telha da fileira de cima (a sobreposição usa o
  // mesmo furo), por isso conta-se um apoio a menos por telha.
  let parafusos = 0;
  const apoiosEfetivos = Math.max(1, nApoios - 1);
  if (ehFibro || ehPvc) parafusos = qtdTelhas * apoiosEfetivos * 2;
  const tipoFixacao = (t.fixacao === 'prego') ? 'Prego telheiro 18×27 + arruela'
                    : (ehPvc ? 'Parafuso + kit de vedação' : 'Parafuso 8 mm + conjunto de vedação');

  // --- Impermeabilização (telhas CRFS sem amianto) ---
  let impermeabilizacao = null;
  if (t.impermeabilizar && td.impermeabilizar !== false) {
    const prod = PRODUTOS_IMPERM[td.produtoImperm] || PRODUTOS_IMPERM['vedbem'];
    const demaos = nnum(td.demaos) || prod.demaos;
    const faces = td.pintarAmbasFaces === true ? 2 : 1;
    // Rendimento por lata: usa o do fabricante por padrão; o usuário pode ajustar
    const rendLata = nnum(td.rendimentoLata) || prod.rendLata;
    const rendimento = rendLata / prod.volumeLata;   // m²/L por demão
    const areaAplicar = areaReal * faces;
    const latas = (areaAplicar * demaos) / rendLata;
    const litros = latas * prod.volumeLata;
    impermeabilizacao = {
      produto: prod, litros, demaos, faces, rendimento, rendLata,
      areaAplicar,
      latasExato: latas,
      latas: Math.ceil(latas),
      volumeLata: prod.volumeLata
    };
  }

  // --- Verificações ---
  const alertas = [];
  if (incl > 0 && t.inclinacaoMin > 0 && incl < t.inclinacaoMin) {
    alertas.push({ tipo: 'erro', txt: `Inclinação de ${fmtDec(incl, 1)}% é inferior à mínima de ${t.inclinacaoMin}% recomendada pelo fabricante para ${t.nome}. Risco de infiltração por refluxo de água.` });
  }
  if (incl <= 0) {
    alertas.push({ tipo: 'aviso', txt: 'Informe a inclinação do telhado para o cálculo da área real.' });
  }
  if (ehFibro && t.vaoMax && madeira.vaoRealTerca > t.vaoMax + 0.005) {
    alertas.push({ tipo: 'erro', txt: `Após distribuir as terças, o vão real fica em ${fmtDec(madeira.vaoRealTerca, 2)} m — acima do vão livre máximo de ${fmtDec(t.vaoMax, 2)} m do fabricante. Reduza o espaçamento.` });
  }
  if (ehFibro && nApoios === 3) {
    alertas.push({ tipo: 'aviso', txt: `Telha de ${fmtDec(compFibro, 2)} m exige apoio intermediário (3 apoios), com fixação também no apoio do meio.` });
  }
  if (td.tipo === 'personalizada' && !(nnum(td.telhasM2Custom) > 0)) {
    alertas.push({ tipo: 'aviso', txt: 'Informe quantas telhas por m² para a telha personalizada.' });
  }

  return {
    tipo: t, tipoKey: td.tipo, ehFibro, ehPvc,
    incl, fator, areaProjetada, areaReal, areaComPerda, perdaPct, nAguas,
    telhasM2, qtdTelhas, pesoTotal, compFibro, areaUtil, recobLong, nApoios,
    madeira, cumeeiras, compCumeeira, parafusos, tipoFixacao, apoiosEfetivos, impermeabilizacao,
    alertas, usaRipa: t.usaRipa
  };
}

// Parâmetros meteorológicos do S2 — NBR 6123, Tabela 21 (b, Fr, p)
const S2_PARAMS = {
  'I':   { A: [1.10, 1.00, 0.06],  B: [1.11, 0.98, 0.065], C: [1.12, 0.95, 0.070] },
  'II':  { A: [1.00, 1.00, 0.085], B: [1.00, 0.98, 0.090], C: [1.00, 0.95, 0.100] },
  'III': { A: [0.94, 1.00, 0.100], B: [0.94, 0.98, 0.105], C: [0.93, 0.95, 0.115] },
  'IV':  { A: [0.86, 1.00, 0.120], B: [0.85, 0.98, 0.125], C: [0.84, 0.95, 0.135] },
  'V':   { A: [0.74, 1.00, 0.150], B: [0.73, 0.98, 0.160], C: [0.71, 0.95, 0.175] }
};
const S2_CATEGORIAS = {
  'I':   'I — Superfície lisa, mar calmo, lago',
  'II':  'II — Campo aberto, poucos obstáculos',
  'III': 'III — Subúrbio, casas baixas, muros',
  'IV':  'IV — Cidade densa, casas agrupadas',
  'V':   'V — Centro com prédios altos'
};
const S3_TIPOS = {
  '1.10': 'Edificação crítica (hospital, quartel)',
  '1.00': 'Edificação normal (residência, comércio)',
  '0.95': 'Edificação com baixo fator de ocupação',
  '0.88': 'Vedações, muros e obras provisórias'
};

// S2 = b · Fr · (z/10)^p — NBR 6123 item 5.3
function calcS2(categoria, classe, z) {
  const p = (S2_PARAMS[categoria] || S2_PARAMS['III'])[classe || 'A'];
  const [b, fr, expo] = p;
  return b * fr * Math.pow(Math.max(z, 1) / 10, expo);
}

// Coeficiente de arrasto de muro isolado (placa ao nível do solo).
// NBR 6123 item 7.6: depende da relação comprimento/altura.
function calcCaMuro(comprimento, altura) {
  if (!(altura > 0)) return 1.2;
  const rel = comprimento / altura;
  if (rel <= 1) return 1.2;
  if (rel <= 2) return 1.25;
  if (rel <= 4) return 1.3;
  if (rel <= 10) return 1.4;
  if (rel <= 20) return 1.5;
  return 1.6;                     // muro muito longo em relação à altura
}

// Cálculo completo do muro.
function calcularMuro(m) {
  const L = nnum(m.altura);              // altura livre (m)
  const d = nnum(m.distPilares);         // espaçamento entre pilares (m)
  const compTotal = nnum(m.compTotal) || (d * 10); // comprimento do muro
  const V0 = nnum(m.v0);                 // velocidade básica (m/s)
  const S1 = nnum(m.s1) || 1.0;
  const S3 = nnum(m.s3) || 1.0;
  const b = nnum(m.b);                   // cm — paralela ao muro
  const h = nnum(m.h);                   // cm — perpendicular (combate o vento)
  const fck = nnum(m.fck) || 25;

  // --- Vento (NBR 6123) ---
  const S2 = calcS2(m.categoria || 'III', m.classe || 'A', L);
  const Vk = V0 * S1 * S2 * S3;
  const q = 0.613 * Vk * Vk / 1000;      // kN/m²
  const Ca = m.caManual ? nnum(m.caManual) : calcCaMuro(compTotal, L);
  const qEfetivo = Ca * q;               // kN/m² já com arrasto
  const cargaLinear = qEfetivo * d;      // kN/m no pilar
  const Mk = cargaLinear * L * L / 2;    // kN·m — momento característico na base
  const Md = 1.4 * Mk;                   // kN·m — momento de cálculo (γf = 1,4)
  const Vd = 1.4 * cargaLinear * L;      // kN — cortante de cálculo na base

  // --- Esbeltez (NBR 6118) ---
  const Le = L * 100 * 2;                // cm — balanço: Le = 2·L
  const I = (b * Math.pow(h, 3)) / 12;   // cm⁴
  const A = b * h;                       // cm²
  const i = A > 0 ? Math.sqrt(I / A) : 0;// cm
  const lambda = i > 0 ? Le / i : 0;

  // λ₁ — esbeltez limite (NBR 6118, 15.8.2). Para pilar em balanço com
  // carga transversal predominante, αb = 1,0 e e1/h ≈ 0 → λ1 = 25 (mín. 35).
  const lambda1 = 35;

  // Classificação
  let classe = '', nivel = '';
  if (lambda <= 35)        { classe = 'Pouco esbelto';             nivel = 'ok'; }
  else if (lambda <= 90)   { classe = 'Esbelto — 2ª ordem por método aproximado'; nivel = 'atencao'; }
  else if (lambda <= 140)  { classe = 'Muito esbelto — 2ª ordem obrigatória';     nivel = 'alerta'; }
  else                     { classe = 'Fora do limite normativo';  nivel = 'reprovado'; }

  // --- Verificações e alertas ---
  const alertas = [];
  if (lambda > 200) {
    alertas.push({ tipo: 'erro', txt: `Índice de esbeltez λ = ${lambda.toFixed(1)} excede 200. A NBR 6118 (item 15.8.1) não admite pilares com λ > 200, salvo postes com força normal desprezível.` });
  } else if (lambda > 140) {
    alertas.push({ tipo: 'erro', txt: `λ = ${lambda.toFixed(1)} ultrapassa 140. A NBR 6118 (15.8.3.1) exige análise rigorosa de 2ª ordem com não-linearidade física e geométrica — métodos aproximados não são permitidos.` });
  } else if (lambda > 90) {
    alertas.push({ tipo: 'aviso', txt: `λ = ${lambda.toFixed(1)} está entre 90 e 140. É obrigatório considerar os efeitos de 2ª ordem; o método do pilar-padrão com curvatura aproximada não se aplica.` });
  }
  // Dimensão mínima (NBR 6118, 13.2.3): seção transversal ≥ 19 cm e área ≥ 360 cm²
  if (Math.min(b, h) < 19) {
    alertas.push({ tipo: 'aviso', txt: `Menor dimensão da seção (${Math.min(b, h)} cm) é inferior a 19 cm. A NBR 6118 (13.2.3) admite entre 19 e 14 cm apenas com γn majorador dos esforços.` });
  }
  if (A < 360) {
    alertas.push({ tipo: 'erro', txt: `Área da seção (${A.toFixed(0)} cm²) é inferior ao mínimo de 360 cm² exigido pela NBR 6118 (13.2.3).` });
  }

  // Verificação preliminar: só é "adequada" se dispensar análise que esta
  // ferramenta não realiza. λ > 90 exige 2ª ordem → não pode ser aprovado aqui.
  const temErro = alertas.some(a => a.tipo === 'erro');
  const aprovado = !temErro && lambda <= 90;
  const exigeAnaliseAvancada = lambda > 90 && !temErro;

  return {
    L, d, compTotal, V0, S1, S2, S3, Vk, q, Ca, qEfetivo,
    cargaLinear, Mk, Md, Vd,
    b, h, Le, I, A, i, lambda, lambda1, fck,
    classe, nivel, alertas, aprovado, exigeAnaliseAvancada,
    categoria: m.categoria || 'III', classeVento: m.classe || 'A'
  };
}

// Sugere a menor seção (h) que traz λ para dentro do limite desejado.
function sugerirSecaoMuro(m, lambdaAlvo = 140) {
  const L = nnum(m.altura);
  const b = nnum(m.b) || 20;
  const Le = L * 100 * 2;
  // λ = Le / i  e  i = h/√12 para seção retangular na direção de h
  // → h = Le·√12 / λ
  const hNec = (Le * Math.sqrt(12)) / lambdaAlvo;
  return Math.ceil(hNec / 5) * 5;   // arredonda para múltiplo de 5 cm
}
const LATAS_POR_SACO = 2;

// Requisitos mínimos para CONCRETO ARMADO — NBR 6118 (Tab. 7.1) + NBR 12655.
const CAA_REQUISITOS = {
  'I':   { desc: 'Rural / submersa (fraca)',        fckMin: 20, acMax: 0.65 },
  'II':  { desc: 'Urbana (moderada)',               fckMin: 25, acMax: 0.60 },
  'III': { desc: 'Marinha / industrial (forte)',    fckMin: 30, acMax: 0.55 },
  'IV':  { desc: 'Respingos de maré (muito forte)', fckMin: 40, acMax: 0.45 }
};

// Volumes — fórmulas conforme a calculadora original.
const volLaje    = l => l.metodo === 'area' ? nnum(l.area) * nnum(l.espessura) : nnum(l.comprimento) * nnum(l.largura) * nnum(l.espessura);
const volPilar   = p => { const sec = p.tipo === 'circular' ? Math.PI * Math.pow(nnum(p.diametro) / 2, 2) : nnum(p.b) * nnum(p.h); return sec * nnum(p.altura) * (nnum(p.quantidade) || 1); };
const volViga    = v => nnum(v.b) * nnum(v.h) * nnum(v.comprimento) * (nnum(v.quantidade) || 1);
const volSapata  = s => s.tipo === 'corrida'
  ? nnum(s.a) * nnum(s.b) * nnum(s.h) * (nnum(s.quantidade) || 1)   // a=largura, b=comprimento
  : nnum(s.a) * nnum(s.b) * nnum(s.h) * (nnum(s.quantidade) || 1);
const nnum = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };

// Calcula tudo: volumes, perda, insumos e verificação normativa.
function calcularConcreto() {
  const c = state.concreto;
  const tL = (c.lajes || []).reduce((s, x) => s + volLaje(x), 0);
  const tP = (c.pilares || []).reduce((s, x) => s + volPilar(x), 0);
  const tV = (c.vigas || []).reduce((s, x) => s + volViga(x), 0);
  const tS = (c.sapatas || []).reduce((s, x) => s + volSapata(x), 0);
  const bruto = tL + tP + tV + tS;
  const perdaPct = nnum(c.perda);
  const final = bruto * (1 + perdaPct / 100);
  const t = TRACOS_CONCRETO[c.fck] || TRACOS_CONCRETO[25];

  // Insumos (concreto virado em obra)
  const cimentoKg = t.cimento * final;
  const sacos = cimentoKg / 50;
  const areiaM3 = t.areia * final;
  const britaM3 = t.brita * final;
  const aguaL = t.agua * final;
  const relacaoAC = t.agua / t.cimento;

  // Verificação normativa (NBR 6118 / 12655) para a classe escolhida
  const req = CAA_REQUISITOS[c.caa] || CAA_REQUISITOS['III'];
  const alertas = [];
  if (c.fck < req.fckMin) {
    alertas.push(`Para classe de agressividade ${c.caa} (${req.desc}), a NBR 6118 exige fck mínimo de ${req.fckMin} MPa para concreto armado. O fck selecionado é ${c.fck} MPa.`);
  }
  if (relacaoAC > req.acMax) {
    alertas.push(`A relação água/cimento deste traço (${relacaoAC.toFixed(2)}) excede o máximo de ${req.acMax.toFixed(2)} exigido para a classe ${c.caa}.`);
  }

  return {
    tL, tP, tV, tS, bruto, final, perdaPct, perdaM3: final - bruto,
    traco: t, cimentoKg, sacos, areiaM3, britaM3, aguaL, relacaoAC,
    req, alertas,
    nItens: (c.lajes || []).length + (c.pilares || []).length + (c.vigas || []).length + (c.sapatas || []).length
  };
}

// Lista de compra pelo TRAÇO EM VOLUME (lata), que é como se vira na obra.
// O cimento manda: a partir dos sacos arredondados, areia e brita saem
// do traço (ex.: fck30 = 1:2:3 → 4 latas de areia e 6 de brita por saco).
function listaCompraConcreto(r) {
  // Arredondamento prático: meio saco para cima (4,03 → 4 · 4,60 → 5).
  // Evita comprar um saco inteiro a mais por causa de alguns quilos.
  const sacos = Math.max(1, Math.round(r.sacos));
  const t = r.traco;
  const latasAreia = Math.round(t.pAreia * LATAS_POR_SACO * sacos);
  const latasBrita = Math.round(t.pBrita * LATAS_POR_SACO * sacos);
  return {
    sacos,
    sacosExato: r.sacos,
    latasAreia,
    latasBrita,
    areiaM3: latasAreia / LATAS_POR_M3,
    britaM3: latasBrita / LATAS_POR_M3,
    aguaL: Math.ceil(r.aguaL / 10) * 10,
    latasPorSaco: LATAS_POR_SACO
  };
}

function showToast(msg, type = 'success') {
  state.toast = { msg, type };
  render();
  setTimeout(() => { if (state.toast && state.toast.msg === msg) { state.toast = null; render(); } }, 2500);
}

const actions = {
  setView(v) { state.view = v; render(); },

  nextNumero() {
    const ano = new Date().getFullYear();
    const doAno = state.orcamentos.filter(o => o.numero && o.numero.endsWith('/' + ano));
    const max = doAno.reduce((m, o) => {
      const n = parseInt((o.numero || '').split('/')[0] || '0');
      return n > m ? n : m;
    }, 0);
    return String(max + 1).padStart(4, '0') + '/' + ano;
  },

  novoOrcamento() {
    state.currentOrc = {
      id: uid(),
      numero: actions.nextNumero(),
      data: today(),
      validade: 15,
      cliente: { nome: '', telefone: '', endereco: '', cpfCnpj: '' },
      obra: { descricao: '', endereco: '' },
      itens: [],
      observacoes: '',
      prazoExecucao: 30,
      dataInicio: today(),
      pagamento: {
        entradaPct: 30,
        leituras: 'Leituras de obra realizadas nos dias 14 e 29 de cada mês, com pagamento nos dias 15 e 30 respectivamente, proporcional à progressão executada (medição).',
      },
      desconto: { tipo: 'pct', valor: 0 },
      modoExibicao: 'detalhado',
      tipoContrato: 'mao_obra',
      status: 'rascunho',
      createdAt: new Date().toISOString(),
    };
    state.view = 'editar';
    render();
  },

  salvarOrc() {
    if (!state.currentOrc) return;
    if (!state.currentOrc.cliente.nome) {
      alert('Informe pelo menos o nome do cliente antes de salvar.');
      return false;
    }
    const orc = { ...state.currentOrc, updatedAt: new Date().toISOString() };
    const idx = state.orcamentos.findIndex(o => o.id === orc.id);
    let novoArr;
    if (idx >= 0) { novoArr = [...state.orcamentos]; novoArr[idx] = orc; }
    else { novoArr = [orc, ...state.orcamentos]; }
    persist('orcamentos', novoArr);
    state.currentOrc = orc;
    showToast('Orçamento salvo');
    return true;
  },

  salvarEVer() { if (actions.salvarOrc()) { state.view = 'visualizar'; render(); } },

  abrirOrc(id) {
    const o = state.orcamentos.find(x => x.id === id);
    if (o) {
      // Garante campos novos pra orçamentos antigos
      const norm = { desconto: { tipo: 'pct', valor: 0 }, modoExibicao: 'detalhado', tipoContrato: 'mao_obra', dataInicio: o.data || today(), prazoExecucao: 30, ...o };
      state.currentOrc = JSON.parse(JSON.stringify(norm));
      state.view = 'visualizar';
      render();
    }
  },

  editarOrcAtual() { state.view = 'editar'; render(); },

  duplicarOrc(id) {
    const o = state.orcamentos.find(x => x.id === id);
    if (!o) return;
    const novo = { ...JSON.parse(JSON.stringify(o)), id: uid(), numero: actions.nextNumero(), data: today(), dataInicio: today(), status: 'rascunho', createdAt: new Date().toISOString() };
    delete novo.updatedAt;
    persist('orcamentos', [novo, ...state.orcamentos]);
    state.currentOrc = novo;
    state.view = 'editar';
    showToast('Orçamento duplicado');
    render();
  },

  excluirOrc(id) {
    if (!confirm('Excluir este orçamento? Esta ação não pode ser desfeita.')) return;
    persist('orcamentos', state.orcamentos.filter(o => o.id !== id));
    showToast('Orçamento excluído');
    if (state.view === 'visualizar' || state.view === 'editar' || state.view === 'contrato') {
      state.view = 'lista'; state.currentOrc = null;
    }
    render();
  },

  updateOrc(path, value) {
    if (!state.currentOrc) return;
    const keys = path.split('.');
    let curr = state.currentOrc;
    for (let i = 0; i < keys.length - 1; i++) {
      if (!curr[keys[i]]) curr[keys[i]] = {};
      curr = curr[keys[i]];
    }
    curr[keys[keys.length - 1]] = value;
    actions.updateTotalDisplay();
  },

  updateTotalDisplay() {
    if (!state.currentOrc) return;
    const subtotal = state.currentOrc.itens.reduce((s, i) => s + (Number(i.quantidade) || 0) * (Number(i.valorUnitario) || 0), 0);
    const descontoVal = calcDesconto(subtotal, state.currentOrc.desconto);
    const total = subtotal - descontoVal;
    const entradaPct = Number(state.currentOrc.pagamento.entradaPct) || 0;
    const entradaVal = total * entradaPct / 100;
    const saldoVal = total - entradaVal;
    const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
    set('subtotal-itens', fmtBRL(subtotal));
    set('desconto-val', '- ' + fmtBRL(descontoVal));
    set('total-geral', fmtBRL(total));
    set('pag-entrada', fmtBRL(entradaVal));
    set('pag-saldo', fmtBRL(saldoVal));
    set('entrada-pct-label', entradaPct + '%');
    const desc = state.currentOrc.desconto || {};
    set('desc-label', desc.tipo === 'pct' ? 'Desconto (' + (desc.valor || 0) + '%):' : 'Desconto:');
    const descRow = document.getElementById('desconto-display-row');
    if (descRow) descRow.style.display = descontoVal > 0 ? 'flex' : 'none';
    const subRow = document.getElementById('subtotal-display-row');
    if (subRow) subRow.style.display = descontoVal > 0 ? 'flex' : 'none';
  },

  updateItem(id, campo, value) {
    if (!state.currentOrc) return;
    const item = state.currentOrc.itens.find(i => i.id === id);
    if (!item) return;
    item[campo] = value;
    const sub = (Number(item.quantidade) || 0) * (Number(item.valorUnitario) || 0);
    const subEl = document.getElementById('sub-' + id);
    if (subEl) subEl.textContent = fmtBRL(sub);
    actions.updateTotalDisplay();
  },

  abrirCatalogoSelector() {
    state.modal = { type: 'catalogoSelector' };
    state.catalogoSelectorFiltro = { busca: '', cat: 'todas' };
    render();
  },

  addItem(catId) {
    const it = state.catalogo.find(c => c.id === catId);
    if (!it) return;
    state.currentOrc.itens.push({
      id: uid(), descricao: it.desc, unidade: it.un, quantidade: 1, valorUnitario: it.val, catalogoId: it.id, categoria: it.cat,
    });
    state.modal = null;
    render();
  },

  addItemAvulso() {
    const novo = { id: uid(), descricao: '', unidade: 'un', quantidade: 1, valorUnitario: 0, categoria: 'Outros' };
    state.currentOrc.itens.push(novo);
    state.modal = { type: 'editItem', data: novo.id };
    render();
  },

  removerItem(id) {
    state.currentOrc.itens = state.currentOrc.itens.filter(i => i.id !== id);
    render();
  },

  editarItem(id) { state.modal = { type: 'editItem', data: id }; render(); },

  mudarStatus(s) {
    if (!state.currentOrc) return;
    state.currentOrc.status = s;
    // Ao aprovar, cria parcelas se ainda não existirem
    if (s === 'aprovado' && (!state.currentOrc.parcelas || state.currentOrc.parcelas.length === 0)) {
      state.currentOrc.parcelas = criarParcelas(state.currentOrc);
      showToast('Parcelas geradas a partir da data de início e do prazo.', 'success');
    }
    actions.salvarOrcSilent();
    render();
  },

  // Recalcula parcelas preservando pagamentos já feitos
  recalcularParcelas(orcId) {
    const orc = orcId ? state.orcamentos.find(o => o.id === orcId) : state.currentOrc;
    if (!orc) return;
    const tinhaPagamentos = (orc.parcelas || []).some(p => (p.pagamentos || []).length > 0);
    const msg = tinhaPagamentos
      ? 'Recalcular as parcelas com a data de início e prazo atuais?\n\nOs pagamentos já registrados serão preservados na mesma ordem (entrada e medições por posição).'
      : 'Recalcular parcelas com a data de início e prazo atuais?';
    if (!confirm(msg)) return;
    orc.parcelas = recalcularParcelasPreservando(orc);
    const arr = [...state.orcamentos];
    const idx = arr.findIndex(o => o.id === orc.id);
    if (idx >= 0) { arr[idx] = orc; persist('orcamentos', arr); }
    if (state.currentOrc && state.currentOrc.id === orc.id) state.currentOrc = orc;
    showToast('Parcelas recalculadas.', 'success');
    render();
  },

  // Abre modal de registro de pagamento
  abrirRegistrarPagamento(orcId, parcelaId) {
    const orc = state.orcamentos.find(o => o.id === orcId);
    if (!orc) return;
    const parcela = (orc.parcelas || []).find(p => p.id === parcelaId);
    if (!parcela) return;
    // Entrada: pré-preenche com saldo da própria parcela.
    // Medição: campo vazio — o valor é apurado na hora pelo Edson.
    const valorInicial = parcela.tipo === 'entrada' ? parcelaSaldo(parcela) : '';
    state.modal = {
      type: 'registrarPagamento',
      data: {
        orcId, parcelaId,
        valor: valorInicial,
        data: today(),
        observacao: ''
      }
    };
    render();
  },

  updatePagamentoForm(campo, val) {
    if (!state.modal || state.modal.type !== 'registrarPagamento') return;
    state.modal.data[campo] = val;
  },

  salvarPagamento() {
    if (!state.modal || state.modal.type !== 'registrarPagamento') return;
    const d = state.modal.data;
    const valor = round2(Number(d.valor) || 0);
    if (valor <= 0) { showToast('Informe um valor maior que zero.', 'error'); return; }
    const orc = state.orcamentos.find(o => o.id === d.orcId);
    if (!orc) return;
    const parcela = (orc.parcelas || []).find(p => p.id === d.parcelaId);
    if (!parcela) return;
    parcela.pagamentos = parcela.pagamentos || [];
    parcela.pagamentos.push({
      id: uid(),
      data: d.data || today(),
      valor: valor,
      observacao: (d.observacao || '').trim()
    });
    const arr = [...state.orcamentos];
    const idx = arr.findIndex(o => o.id === orc.id);
    if (idx >= 0) { arr[idx] = orc; persist('orcamentos', arr); }
    if (state.currentOrc && state.currentOrc.id === orc.id) state.currentOrc = orc;
    state.modal = null;
    showToast(`Pagamento de ${fmtBRL(valor)} registrado.`, 'success');
    render();
  },

  excluirPagamento(orcId, parcelaId, pagamentoId) {
    if (!confirm('Excluir este pagamento? Esta ação não pode ser desfeita.')) return;
    const orc = state.orcamentos.find(o => o.id === orcId);
    if (!orc) return;
    const parcela = (orc.parcelas || []).find(p => p.id === parcelaId);
    if (!parcela) return;
    parcela.pagamentos = (parcela.pagamentos || []).filter(p => p.id !== pagamentoId);
    const arr = [...state.orcamentos];
    const idx = arr.findIndex(o => o.id === orc.id);
    if (idx >= 0) { arr[idx] = orc; persist('orcamentos', arr); }
    if (state.currentOrc && state.currentOrc.id === orc.id) state.currentOrc = orc;
    showToast('Pagamento excluído.', 'success');
    render();
  },

  irParaFinanceiro() { state.view = 'financeiro'; state.financeiroFiltro = state.financeiroFiltro || 'todas'; render(); },

  setFinanceiroFiltro(f) { state.financeiroFiltro = f; render(); },

  // Abre a view de recibo de um pagamento específico
  abrirRecibo(orcId, parcelaId, pagamentoId) {
    state.reciboRef = { orcId, parcelaId, pagamentoId };
    state.view = 'recibo';
    render();
  },

  // ===== ASSINATURA DIGITAL =====
  abrirAssinatura(orcId) {
    const orc = state.orcamentos.find(o => o.id === orcId);
    if (!orc) return;
    state.modal = {
      type: 'coletarAssinatura',
      data: { orcId, assinante: orc.cliente?.nome || '' }
    };
    render();
    // Aguarda o DOM ser injetado antes de inicializar o canvas
    setTimeout(setupSignatureCanvas, 0);
  },

  updateAssinaturaForm(campo, val) {
    if (!state.modal || state.modal.type !== 'coletarAssinatura') return;
    state.modal.data[campo] = val;
  },

  limparCanvasAssinatura() {
    const canvas = document.getElementById('sigCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    canvas._temDesenho = false;
  },

  salvarAssinatura() {
    if (!state.modal || state.modal.type !== 'coletarAssinatura') return;
    const canvas = document.getElementById('sigCanvas');
    if (!canvas) { showToast('Erro ao acessar a área de assinatura.', 'error'); return; }
    if (!canvas._temDesenho) { showToast('A assinatura está vazia. Peça pro cliente assinar antes de confirmar.', 'error'); return; }
    const d = state.modal.data;
    const assinante = (d.assinante || '').trim();
    if (!assinante) { showToast('Informe o nome de quem está assinando.', 'error'); return; }

    const orc = state.orcamentos.find(o => o.id === d.orcId);
    if (!orc) return;
    // Salva como PNG base64 (típico 5-15KB)
    const dataURL = canvas.toDataURL('image/png');
    orc.assinatura = {
      dataURL,
      assinante,
      data: new Date().toISOString()
    };
    const arr = [...state.orcamentos];
    const idx = arr.findIndex(o => o.id === orc.id);
    if (idx >= 0) { arr[idx] = orc; persist('orcamentos', arr); }
    if (state.currentOrc && state.currentOrc.id === orc.id) state.currentOrc = orc;
    state.modal = null;
    showToast('Assinatura coletada e registrada.', 'success');
    render();
  },

  refazerAssinatura(orcId) {
    if (!confirm('Refazer a assinatura? A atual será substituída.')) return;
    this.abrirAssinatura(orcId);
  },

  removerAssinatura(orcId) {
    if (!confirm('Remover a assinatura do cliente? Esta ação não pode ser desfeita.')) return;
    const orc = state.orcamentos.find(o => o.id === orcId);
    if (!orc) return;
    delete orc.assinatura;
    const arr = [...state.orcamentos];
    const idx = arr.findIndex(o => o.id === orc.id);
    if (idx >= 0) { arr[idx] = orc; persist('orcamentos', arr); }
    if (state.currentOrc && state.currentOrc.id === orc.id) state.currentOrc = orc;
    showToast('Assinatura removida.', 'success');
    render();

  manualBusca(v) {

    render();
  },

  abrirCategoriaManual(cat) {

    state.view = 'manualCategoria';

  abrirFichaManual(id) {

    if (!ficha) return;
    state.manualFichaAtual = ficha;

    const recentes = (state.manualRecentes || []).filter(rid => rid !== id);

    persist('manualRecentes', recentes.slice(0, 10));

  voltarManual() {

      state.view = 'manualCategoria';
    } else {
      state.view = 'manual';
    }
    state.manualFichaAtual = null;

  toggleFavorito(id) {

  novaFichaManual(categoriaPreSelecionada) {

  },

  // ===== Salvar/excluir ficha =====
  salvarFichaManual() {
    if (!state.modal || state.modal.type !== 'editarFichaManual') return;
    const d = state.modal.data;
    if (!d.categoria || !d.categoria.trim()) { showToast('Informe a categoria.', 'error'); return; }
    if (!d.tema || !d.tema.trim()) { showToast('Informe o tema.', 'error'); return; }
    if (!d.resumo || !d.resumo.trim()) { showToast('Informe o resumo.', 'error'); return; }

    // Limpa linhas e itens vazios
    d.tabelas = (d.tabelas || []).filter(t => t.titulo && t.titulo.trim()).map(t => ({
      titulo: t.titulo.trim(),
      colunas: (t.colunas || []).map(c => (c || '').trim()),
      linhas: (t.linhas || []).filter(l => l.some(c => (c || '').trim())).map(l => l.map(c => (c || '').trim()))
    }));
    d.checklists = (d.checklists || []).filter(c => c.titulo && c.titulo.trim()).map(c => ({
      titulo: c.titulo.trim(),
      itens: (c.itens || []).map(i => (i || '').trim()).filter(i => i)
    }));
    d.referencias = (d.referencias || []).filter(r => r && r.trim()).map(r => r.trim());

    const arr = [...state.manualFichas];
    if (d.id) {
      const idx = arr.findIndex(f => f.id === d.id);
      if (idx >= 0) {
        arr[idx] = { ...arr[idx], ...d, atualizadoEm: new Date().toISOString() };
      }
    } else {
      arr.push({
        ...d,
        id: uid(),
        criadoEm: new Date().toISOString(),
        atualizadoEm: new Date().toISOString()
      });
    }
    persist('manualFichas', arr);
    state.modal = null;
    showToast(d.id ? 'Ficha atualizada' : 'Ficha criada', 'success');
    // Se estava editando uma ficha atual, atualiza
    if (state.manualFichaAtual && d.id === state.manualFichaAtual.id) {

  // Converte uma Vistoria em Laudo (ou Laudo em Vistoria, se precisar desfazer).
  // Mantém TODOS os dados (fissuras, fotos, leituras). Só muda categoria + numeração.
  converterCategoria(id) {
    const arr = [...state.laudos];
    const idx = arr.findIndex(l => l.id === id);
    if (idx < 0) return;
    const doc = arr[idx];
    const categoriaAtual = doc.categoria || 'vistoria';
    const categoriaNova = categoriaAtual === 'vistoria' ? 'laudo' : 'vistoria';
    const rotuloAtual = rotuloDocumento(categoriaAtual, 'singularLower');
    const rotuloNovo = rotuloDocumento(categoriaNova, 'singularLower');

    let msg;
    if (categoriaNova === 'laudo') {
      msg = `Converter esta ${rotuloAtual} em ${rotuloNovo.toUpperCase()}?\n\nIMPORTANTE — ao converter em laudo, você ASSUME responsabilidade técnica formal pelo documento. O texto de conclusão técnica passa a ser exigido, e recomenda-se anotar ART/RRT/TRT.\n\nNúmero atual: ${doc.numero}\nNovo número: ${proxNumeroDocumento('laudo')}`;
    } else {
      msg = `Converter este ${rotuloAtual} em ${rotuloNovo.toUpperCase()}?\n\nO documento passa a ser um REGISTRO DE FATOS, sem tese pericial. Você pode reverter a qualquer momento.\n\nNúmero atual: ${doc.numero}\nNovo número: ${proxNumeroDocumento('vistoria')}`;
    }
    if (!confirm(msg)) return;

    arr[idx].categoria = categoriaNova;
    arr[idx].numero = proxNumeroDocumento(categoriaNova);
    arr[idx].atualizadoEm = new Date().toISOString();
    persist('laudos', arr);
    if (state.laudoAtual && state.laudoAtual.id === id) state.laudoAtual = arr[idx];
    showToast(`Convertido para ${rotuloNovo}`, 'success');
    render();
  },

  salvarFissura() {
    if (!state.modal || state.modal.type !== 'editarFissura') return;
    const d = state.modal.data;
    if (!d.codigo || !d.codigo.trim()) { showToast('Informe o código da fissura.', 'error'); return; }
    if (!d.paquimetroInicial || Number(d.paquimetroInicial) <= 0) { showToast('Informe a medição inicial do paquímetro (mm).', 'error'); return; }
    if (!d.local || !d.local.trim()) { showToast('Informe o local/cômodo.', 'error'); return; }

    const laudoArr = [...state.laudos];
    const laudoIdx = laudoArr.findIndex(l => l.id === d.laudoId);
    if (laudoIdx < 0) return;
    const laudo = laudoArr[laudoIdx];
    laudo.fissuras = laudo.fissuras || [];

    if (d.id) {
      const fIdx = laudo.fissuras.findIndex(f => f.id === d.id);
      if (fIdx >= 0) {
        const novo = { ...laudo.fissuras[fIdx], ...d };
        // Normaliza numéricos
        novo.paquimetroInicial = Number(d.paquimetroInicial);
        novo.medidorInicial = (d.medidorInicial === '' || d.medidorInicial == null) ? null : Number(d.medidorInicial);
        novo.comprimento = Number(d.comprimento) || 0;
        novo.seloInstalado = !!d.seloInstalado;
        // Limpa o campo legado pra não confundir
        delete novo.aberturaInicial;
        laudo.fissuras[fIdx] = novo;
      }
    } else {
      const novaF = {
        id: uid(),
        codigo: d.codigo.trim(),
        dataCadastro: d.dataCadastro,
        local: d.local.trim(),
        face: d.face,
        posicaoX: d.posicaoX,
        posicaoY: d.posicaoY,
        paquimetroInicial: Number(d.paquimetroInicial),
        medidorInicial: (d.medidorInicial === '' || d.medidorInicial == null) ? null : Number(d.medidorInicial),
        seloInstalado: !!d.seloInstalado,
        dataInstalacaoSelo: d.dataInstalacaoSelo || '',
        comprimento: Number(d.comprimento) || 0,
        orientacao: d.orientacao,
        hipoteseCausa: d.hipoteseCausa,
        testemunhos: d.testemunhos,
        observacoes: d.observacoes,
        fotosMarcoZero: d.fotosMarcoZero || [],
        leituras: []
      };
      laudo.fissuras.push(novaF);
    }
    laudo.atualizadoEm = new Date().toISOString();
    persist('laudos', laudoArr);
    state.laudoAtual = laudo;
    state.modal = null;
    showToast(d.id ? 'Fissura atualizada' : 'Fissura cadastrada', 'success');
    render();
  },

  salvarLeitura() {
    if (!state.modal || state.modal.type !== 'editarLeitura') return;
    const d = state.modal.data;
    if (!d.dataLeitura) { showToast('Informe a data da leitura.', 'error'); return; }
    // Validação: ao menos 1 dos 3 instrumentos preenchido
    const paqOk = d.paquimetro !== '' && d.paquimetro != null && Number(d.paquimetro) > 0;
    const medOk = d.medidor !== '' && d.medidor != null && Number(d.medidor) > 0;
    const seloOk = !!d.estadoSelo;
    if (!paqOk && !medOk && !seloOk) {
      showToast('Preencha ao menos uma medição: paquímetro, medidor ou estado do selo.', 'error');
      return;
    }

    const laudoArr = [...state.laudos];
    const laudoIdx = laudoArr.findIndex(l => l.id === d.laudoId);
    if (laudoIdx < 0) return;
    const laudo = laudoArr[laudoIdx];
    const fIdx = (laudo.fissuras || []).findIndex(f => f.id === d.fissuraId);
    if (fIdx < 0) return;
    const fissura = laudo.fissuras[fIdx];
    fissura.leituras = fissura.leituras || [];

    const leituraObj = {

  // Adiciona uma medição extra ao contrato (útil quando obra estende além do prazo)
  adicionarMedicao(orcId) {
    const orc = state.orcamentos.find(o => o.id === orcId);
    if (!orc) return;
    const data = prompt('Data prevista para esta medição (DD/MM/AAAA):', '');
    if (!data) return;
    // Aceita DD/MM/AAAA ou AAAA-MM-DD
    let iso = data.trim();
    const m = iso.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) iso = `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) { showToast('Data inválida. Use DD/MM/AAAA.', 'error'); return; }
    // Define dataLeitura = um dia antes do pagamento
    const dt = new Date(iso + 'T00:00:00');
    const dtLeitura = new Date(dt); dtLeitura.setDate(dtLeitura.getDate() - 1);
    const dataLeitura = dtLeitura.toISOString().slice(0, 10);

    const medicoes = (orc.parcelas || []).filter(p => p.tipo === 'medicao');
    const num = medicoes.length + 1;
    orc.parcelas = [...(orc.parcelas || []), {
      id: uid(), tipo: 'medicao',
      descricao: `Medição ${num}`,
      dataLeitura, dataPrevista: iso,
      pagamentos: []
    }];
    // Reordena medições por data prevista pra manter timeline coerente
    const entrada = orc.parcelas.filter(p => p.tipo === 'entrada');
    const medi = orc.parcelas.filter(p => p.tipo === 'medicao')
      .sort((a, b) => (a.dataPrevista || '').localeCompare(b.dataPrevista || ''))
      .map((m, i) => ({ ...m, descricao: (m.pagamentos || []).length === 0 ? `Medição ${i + 1}` : m.descricao }));
    orc.parcelas = [...entrada, ...medi];

    const arr = [...state.orcamentos];
    const idx = arr.findIndex(o => o.id === orc.id);
    if (idx >= 0) { arr[idx] = orc; persist('orcamentos', arr); }
    if (state.currentOrc && state.currentOrc.id === orc.id) state.currentOrc = orc;
    showToast('Medição adicionada.', 'success');
    render();
  },

  excluirMedicao(orcId, parcelaId) {

    if (!p) return;
    if ((p.pagamentos || []).length > 0) {
      showToast('Não dá pra excluir uma medição que já tem pagamento. Exclua os pagamentos antes.', 'error');
      return;
    }
    if (!confirm(`Excluir "${p.descricao}"?`)) return;
    orc.parcelas = orc.parcelas.filter(x => x.id !== parcelaId);
    // Renumera as medições restantes que não têm pagamento
    let i = 0;
    orc.parcelas.forEach(x => {
      if (x.tipo === 'medicao' && (x.pagamentos || []).length === 0) {
        i++;
        x.descricao = `Medição ${i + (orc.parcelas.filter(y => y.tipo === 'medicao' && (y.pagamentos || []).length > 0).length)}`;
      }
    });
    const arr = [...state.orcamentos];
    const idx = arr.findIndex(o => o.id === orc.id);
    if (idx >= 0) { arr[idx] = orc; persist('orcamentos', arr); }
    if (state.currentOrc && state.currentOrc.id === orc.id) state.currentOrc = orc;
    showToast('Medição excluída.', 'success');

  async compartilhar() {
    // Caso especial: tela do recibo (não depende de currentOrc)
    if (state.view === 'recibo') {
      const ref = state.reciboRef;
      const o = ref ? state.orcamentos.find(x => x.id === ref.orcId) : null;
      const parcela = o ? (o.parcelas || []).find(p => p.id === ref.parcelaId) : null;
      const pagamento = parcela ? (parcela.pagamentos || []).find(pg => pg.id === ref.pagamentoId) : null;
      if (!o || !parcela || !pagamento) { window.print(); return; }
      const seq = String(numeroRecibo(o, pagamento)).padStart(2, '0');
      const texto = montarTextoRecibo(o, parcela, pagamento);
      const titulo = `Recibo Nº ${seq}/${o.numero} - ${state.empresa?.nome || 'Sua Empresa'}`;
      return await this._shareWithFallback(texto, titulo);
    }

    const o = state.currentOrc;
    if (!o) { window.print(); return; }

    const ehContrato = state.view === 'contrato';
    const texto = ehContrato ? montarTextoContrato(o) : montarTextoOrcamento(o);
    const titulo = ehContrato
      ? `Contrato Nº ${o.numero} - ${state.empresa?.nome || 'Sua Empresa'}`
      : `Proposta Nº ${o.numero} - ${state.empresa?.nome || 'Sua Empresa'}`;
    return await this._shareWithFallback(texto, titulo);
  },

  // Fluxo de share + fallbacks (extraído pra reuso entre orçamento, contrato e recibo)
  async _shareWithFallback(texto, titulo) {
    if (navigator.share) {
      try {
        await navigator.share({ title: titulo, text: texto });
        return;
      } catch (err) {
        if (err && err.name === 'AbortError') return;
      }
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(texto);
        alert('Compartilhamento direto não disponível neste navegador.\n\nO texto foi copiado para a área de transferência — basta colar no WhatsApp, e-mail ou qualquer app.\n\nPara gerar o PDF, use o botão "PDF" ao lado.');
        return;
      }
    } catch (err) { /* segue */ }
    try {
      const ta = document.createElement('textarea');
      ta.value = texto;
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if (ok) { alert('Texto copiado.\nCole no WhatsApp, e-mail ou qualquer app de mensagens.'); return; }
    } catch (err) { /* desistir */ }
    window.print();
  },

    const conteudo = JSON.stringify(data, null, 2);
    const blob = new Blob([conteudo], { type: 'application/json' });

    // Tenta a folha de compartilhamento nativa (Android: Drive, WhatsApp, e-mail...).
    if (navigator.canShare && navigator.share) {
      try {
        const file = new File([blob], nomeArq, { type: 'application/json' });
        if (navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: 'Backup GestorCivil',
            text: 'Backup dos dados do GestorCivil — ' + today() });
          marcarBackupExterno();
          showToast('Backup compartilhado');
          if (state.modal && state.modal.type === 'lembreteBackup') { state.modal = null; render(); }
          return;
        }
      } catch (err) {
        // usuário cancelou o compartilhamento OU navegador não suporta arquivos → cai pro download
        if (err && err.name === 'AbortError') { showToast('Compartilhamento cancelado'); return; }
      }
    }
    // Fallback (navegador de PC): download normal do arquivo.
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nomeArq;
    a.click();
    URL.revokeObjectURL(url);
    marcarBackupExterno();
    showToast('Backup salvo — envie para o Google Drive');
    if (state.modal && state.modal.type === 'lembreteBackup') { state.modal = null; render(); }
  },

    // "Depois" — silencia o lembrete por mais 2 dias.
    try {
      const daqui2 = Date.now() - (LEMBRETE_DIAS - 2) * 24 * 60 * 60 * 1000;

  importarBackup() {
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'application/json,.json';
    inp.onchange = (e) => {
      const file = e.target.files[0]; if (!file) return;
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (!data.orcamentos || !data.catalogo || !data.empresa) { alert('Arquivo de backup inválido.'); return; }
          if (!confirm('Importar backup? Os dados atuais serão SUBSTITUÍDOS pelos do arquivo.')) return;
          persist('orcamentos', data.orcamentos);
          persist('catalogo', data.catalogo);
          persist('empresa', { ...COMPANY_DEFAULT, ...data.empresa });
          if (Array.isArray(data.manualFichas)) persist('manualFichas', data.manualFichas);
          if (Array.isArray(data.manualRecentes)) persist('manualRecentes', data.manualRecentes);
          if (Array.isArray(data.colaboradores)) persist('colaboradores', data.colaboradores);
          if (Array.isArray(data.obrasFolha)) persist('obrasFolha', data.obrasFolha);
          if (Array.isArray(data.diasTrabalhados)) persist('diasTrabalhados', data.diasTrabalhados);
          if (Array.isArray(data.entradas)) persist('entradas', data.entradas);
          if (Array.isArray(data.despesas)) persist('despesas', data.despesas);
          if (Array.isArray(data.etapasObra)) persist('etapasObra', data.etapasObra);
  if (Array.isArray(data.etapasObra)) persist('etapasObra', data.etapasObra);
          if (Array.isArray(data.adiantamentos)) persist('adiantamentos', data.adiantamentos);
          if (Array.isArray(data.categoriasDespesa)) persist('categoriasDespesa', data.categoriasDespesa);
          if (Array.isArray(data.laudos)) {
            // Separa as fotos embutidas (.data) para o IndexedDB e mantém no
            // localStorage apenas a referência leve { id, capturadaEm }.
            showToast('Importando fotos...');
            for (const l of data.laudos) {
              for (const f of (l.fissuras || [])) {
                for (const ft of (f.fotosMarcoZero || [])) {
                  if (ft && ft.data) {
                    if (!ft.id) ft.id = uid();
                    FOTO_CACHE[ft.id] = ft.data;
                    await FotoDB.put(ft.id, ft.data);
                    delete ft.data;
                  }
                }
                for (const le of (f.leituras || [])) {
                  for (const ft of (le.fotos || [])) {
                    if (ft && ft.data) {
                      if (!ft.id) ft.id = uid();
                      FOTO_CACHE[ft.id] = ft.data;
                      await FotoDB.put(ft.id, ft.data);
                      delete ft.data;
                    }
                  }
                }
              }
            }
            persist('laudos', data.laudos);
          }
          showToast('Backup importado (fotos incluídas)');
          render();
        } catch (err) { alert('Erro ao ler o arquivo: ' + err.message); }
      };
      reader.readAsText(file);
    };
    inp.click();
  },

    state.modal = { type: 'editarDia', data: {

      data: hoje, jornadaTipo: 'cheia', saldoHoras: 0, obs: ''

  updateDiaForm(campo, val) {
    if (!state.modal || state.modal.type !== 'editarDia') return;
    state.modal.data[campo] = val;
    if (campo === 'jornadaTipo' || campo === 'colaboradorId') render(); // atualiza prévia
  },
  salvarDia(manterAberto) {
    if (!state.modal || state.modal.type !== 'editarDia') return;
    const d = state.modal.data;
    if (!d.colaboradorId) { showToast('Escolha o colaborador.', 'error'); return; }
    if (!d.data) { showToast('Informe a data.', 'error'); return; }
    if (!d.obraId) { showToast('Escolha a obra.', 'error'); return; }

    // Aviso (não bloqueio) de registro duplicado na mesma data — evita pagar em
    // dobro por engano, mas permite dois turnos/obras no mesmo dia se confirmado.
    if (!d.id && !d._confirmadoDuplicado) {
      const jaExiste = (state.diasTrabalhados || []).filter(x =>
        x.colaboradorId === d.colaboradorId && x.data === d.data);
      if (jaExiste.length > 0) {
        const colab = getColaborador(d.colaboradorId);
        const nomes = jaExiste.map(x => {
          const o = getObraFolha(x.obraId);
          return o ? o.nome : 'obra';
        });
        const nome = colab ? colab.nome : 'Este colaborador';
        const msg = `${nome} já tem ${jaExiste.length} lançamento(s) em ${fmtDataCurta(d.data)} (${nomes.join(', ')}).\n\nRegistrar mesmo assim? (confirme apenas se for outro turno ou outra obra)`;
        if (!confirm(msg)) return;
        d._confirmadoDuplicado = true;
      }
    }

    const arr = [...state.diasTrabalhados];
    const registro = { ...d, saldoHoras: Number(d.saldoHoras) || 0 };
    delete registro._confirmadoDuplicado;   // flag interna não vai pro dado salvo
    if (d.id) {
      const idx = arr.findIndex(x => x.id === d.id);
      if (idx >= 0) arr[idx] = registro;
    } else {
      arr.push({ ...registro, id: uid(), criadoEm: new Date().toISOString() });
    }
    persist('diasTrabalhados', arr);

    if (manterAberto) {
      // Mantém data e obra, limpa colaborador e campos do dia para o próximo.
      const colabNome = (getColaborador(d.colaboradorId) || {}).nome || 'Colaborador';
      state.modal = { type: 'editarDia', data: {
        colaboradorId: '', obraId: d.obraId, data: d.data,
        jornadaTipo: 'cheia', saldoHoras: 0, obs: ''
      } };
      showToast(colabNome + ' registrado — próximo');
    } else {
      state.modal = null;
      showToast('Dia registrado');
    }
    render();
  },

    if (!confirm('Excluir este lançamento?')) return;
    persist('diasTrabalhados', state.diasTrabalhados.filter(x => x.id !== id));
    state.modal = null;
    showToast('Lançamento excluído');

  addConcretoItem() {
    const c = state.concreto;
    const f = c.form || {};
    const nome = (f.nome || '').trim();
    const q = nnum(f.quantidade) || 1;
    let item = null, lista = '';

    if (c.aba === 'lajes') {
      lista = 'lajes';
      if (c.lajeMetodo === 'area') {
        if (!(nnum(f.area) > 0) || !(nnum(f.espessura) > 0)) { showToast('Informe área e espessura.', 'error'); return; }
        item = { metodo: 'area', nome: nome || 'Laje', area: nnum(f.area), espessura: nnum(f.espessura) };
      } else {
        if (!(nnum(f.comprimento) > 0) || !(nnum(f.largura) > 0) || !(nnum(f.espessura) > 0)) { showToast('Informe comprimento, largura e espessura.', 'error'); return; }
        item = { metodo: 'dimensoes', nome: nome || 'Laje', comprimento: nnum(f.comprimento), largura: nnum(f.largura), espessura: nnum(f.espessura) };
      }
    } else if (c.aba === 'pilares') {
      lista = 'pilares';
      if (c.pilarTipo === 'circular') {
        if (!(nnum(f.diametro) > 0) || !(nnum(f.altura) > 0)) { showToast('Informe diâmetro e altura.', 'error'); return; }
        item = { tipo: 'circular', nome: nome || 'Pilar', diametro: nnum(f.diametro), altura: nnum(f.altura), quantidade: q };
      } else {
        if (!(nnum(f.b) > 0) || !(nnum(f.h) > 0) || !(nnum(f.altura) > 0)) { showToast('Informe seção e altura.', 'error'); return; }
        item = { tipo: 'retangular', nome: nome || 'Pilar', b: nnum(f.b), h: nnum(f.h), altura: nnum(f.altura), quantidade: q };
      }
    } else if (c.aba === 'vigas') {
      lista = 'vigas';
      if (!(nnum(f.b) > 0) || !(nnum(f.h) > 0) || !(nnum(f.comprimento) > 0)) { showToast('Informe seção e comprimento.', 'error'); return; }
      item = { nome: nome || 'Viga', b: nnum(f.b), h: nnum(f.h), comprimento: nnum(f.comprimento), quantidade: q };
    } else if (c.aba === 'sapatas') {
      lista = 'sapatas';
      if (!(nnum(f.a) > 0) || !(nnum(f.b) > 0) || !(nnum(f.h) > 0)) { showToast('Informe as dimensões.', 'error'); return; }
      item = { tipo: c.sapataTipo, nome: nome || (c.sapataTipo === 'corrida' ? 'Sapata corrida' : 'Sapata'), a: nnum(f.a), b: nnum(f.b), h: nnum(f.h), quantidade: q };
    }
    if (!item) return;
    item.id = uid();
    c[lista] = [...(c[lista] || []), item];
    c.form = {};
    showToast('Item adicionado');
    render();

    <nav class="bottom-nav no-print">
      ${bn('home', 'Início', ICON.home, "actions.setView('home')")}

function renderToast() {
  if (!state.toast) return '';
  return `<div class="toast ${state.toast.type}">${esc(state.toast.msg)}</div>`;
}

function renderEquipe() {
  const colaboradores = state.colaboradores || [];
  const ativos = colaboradores.filter(c => c.ativo !== false);
  const obras = state.obrasFolha || [];
  const filtro = state.equipeFiltro || { periodo: 'quinzena_atual' };

  // Determina o intervalo do período selecionado
  const per = filtro.periodo === 'mes_atual'
    ? periodoDatas(null, 'mensal')
    : periodoDatas(null, 'quinzenal');

  // Total geral a pagar no período
  let totalGeral = 0;
  ativos.forEach(c => { totalGeral += resumoPagamento(c, per.ini, per.fim).totalLiquido; });

  return `
    <div class="stack">
      <div class="row-between flex-wrap" style="align-items:center;">
        <button class="back-btn" onclick="actions.setView('home')">${ICON.chevronLeft} Início</button>
        <h1 style="font-size: 22px; font-weight: 700; color: var(--primary); margin:0;">${ICON.users} Equipe</h1>
        <span></span>
      </div>

      <!-- Seletor de período + total -->
      <div class="card" style="background: linear-gradient(135deg, var(--primary), var(--primary-light)); color:white;">
        <div style="font-size:12px; opacity:.85; margin-bottom:4px;">Total a pagar · ${per.rotulo}</div>
        <div style="font-size:28px; font-weight:800;">${fmtBRL(totalGeral)}</div>
        <div class="mode-row" style="margin-top:12px; background:rgba(255,255,255,.12); border-radius:8px; padding:4px;">
          <button class="mode-btn ${filtro.periodo !== 'mes_atual' ? 'active' : ''}" style="${filtro.periodo !== 'mes_atual' ? '' : 'color:white;'}" onclick="actions.equipePeriodo('quinzena_atual')">Quinzena</button>
          <button class="mode-btn ${filtro.periodo === 'mes_atual' ? 'active' : ''}" style="${filtro.periodo === 'mes_atual' ? '' : 'color:white;'}" onclick="actions.equipePeriodo('mes_atual')">Mês</button>
        </div>
      </div>

      <!-- Ações rápidas -->
      <div class="row flex-wrap" style="gap:8px;">
        <button class="btn btn-primary" onclick="actions.novoDiaTrabalhado()">${ICON.plus} Registrar dia</button>
        <button class="btn btn-secondary" onclick="actions.novoColaborador()">${ICON.user} Colaborador</button>
        <button class="btn btn-secondary" onclick="actions.novaObraFolha()">${ICON.building} Obra</button>
      </div>

      <!-- Pagamento por colaborador -->
      ${ativos.length === 0 ? `
        <div class="card empty">
          ${ICON.users}
          <div class="empty-msg">Nenhum colaborador ainda.<br>Toque em <strong>Colaborador</strong> para cadastrar o primeiro.</div>
        </div>
      ` : `
        <div class="card">
          <div class="card-title">${ICON.dollar} A pagar neste período</div>
          <div class="stack-sm">
            ${ativos.map(c => renderEquipeColaboradorRow(c, per)).join('')}
          </div>
        </div>
      `}

      <!-- Obras (custo de mão de obra) -->
      ${obras.length > 0 ? `
        <div class="card">
          <div class="card-title">${ICON.building} Custo por obra · ${per.rotulo}</div>
          <div class="stack-sm">
            ${obras.filter(o => o.ativo !== false).map(o => {
              const custo = custoObraPeriodo(o.id, per.ini, per.fim);
              return `
                <div class="row-between" style="padding:10px 12px; background:var(--bg-soft,#F8FAFC); border-radius:8px;">
                  <div>
                    <div style="font-weight:600; font-size:14px;">${esc(o.nome)}</div>
                    ${o.cliente ? `<div style="font-size:11px; color:var(--muted);">${esc(o.cliente)}</div>` : ''}
                  </div>
                  <div style="text-align:right;">
                    <div style="font-weight:700; color:var(--primary);">${fmtBRL(custo.total)}</div>
                    <div style="font-size:11px; color:var(--muted);">${custo.nLancamentos} lançamento${custo.nLancamentos === 1 ? '' : 's'}</div>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        </div>
      ` : ''}

      <!-- Gestão: colaboradores e obras cadastrados -->
      <div class="card">
        <div class="card-title">${ICON.users} Colaboradores cadastrados</div>
        <div class="stack-sm">
          ${colaboradores.length === 0 ? `<div style="font-size:13px; color:var(--muted); padding:8px;">Nenhum colaborador.</div>` :
            colaboradores.map(c => `
              <div class="row-between" style="padding:10px 12px; background:var(--bg-soft,#F8FAFC); border-radius:8px; ${c.ativo === false ? 'opacity:.55;' : ''}">
                <div onclick="actions.editarColaborador('${c.id}')" style="cursor:pointer; flex:1;">
                  <div style="font-weight:600; font-size:14px;">${esc(c.nome)} ${c.ativo === false ? '<span style="font-size:10px; color:var(--muted);">(inativo)</span>' : ''}</div>
                  <div style="font-size:11px; color:var(--muted);">
                    ${c.tipo === 'mensalista'
                      ? 'Mensalista · ' + fmtBRL(Number(c.salarioMensal) || 0) + '/mês'
                      : 'Diarista · ' + fmtBRL(Number(c.valorDiaria) || 0) + '/dia · extra +' + (c.pctExtra != null ? c.pctExtra : EXTRA_PADRAO) + '%'}
                    · ${c.ciclo === 'mensal' ? 'paga dia 30' : 'paga 15 e 30'}
                  </div>
                </div>
                <div class="row" style="gap:4px;">
                  <button class="btn btn-ghost btn-sm" onclick="actions.novoDiaTrabalhado('${c.id}')" title="Registrar dia">${ICON.calendar}</button>
                  <button class="btn btn-ghost btn-sm" onclick="actions.editarColaborador('${c.id}')">${ICON.edit}</button>
                </div>
              </div>
            `).join('')}
        </div>
      </div>
    </div>
  `;
}

// Linha de resumo de pagamento de um colaborador no período, expansível para ver os dias.
function renderEquipeColaboradorRow(c, per) {
  const r = resumoPagamento(c, per.ini, per.fim);
  const dias = c.tipo === 'diarista' ? diasNoPeriodo(c.id, per.ini, per.fim).sort((a, b) => a.data.localeCompare(b.data)) : [];
  const detalhe = c.tipo === 'mensalista'
    ? 'Salário fixo do mês'
    : `${r.diasCheios} diária${r.diasCheios === 1 ? '' : 's'}${r.diasMeios ? ' + ' + r.diasMeios + ' meia' + (r.diasMeios === 1 ? '' : 's') : ''}${r.faltas ? ' · ' + r.faltas + ' falta' + (r.faltas === 1 ? '' : 's') : ''}${r.saldoHoras ? ' · ' + (r.saldoHoras > 0 ? '+' : '') + r.saldoHoras + 'h' : ''}`;
  return `
    <details class="equipe-colab" style="background:var(--bg-soft,#F8FAFC); border-radius:8px; padding:0;">
      <summary style="list-style:none; cursor:pointer; padding:12px; display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-weight:600; font-size:14px;">${esc(c.nome)}</div>
          <div style="font-size:11px; color:var(--muted);">${detalhe}</div>
        </div>
        <div style="text-align:right;">
          <div style="font-weight:700; color:var(--success); font-size:16px;">${fmtBRL(r.totalLiquido)}</div>
          ${r.adiantado > 0 ? `<div style="font-size:11px; color:var(--accent-dark);">bruto ${fmtBRL(r.total)} − ${fmtBRL(r.adiantado)} adiant.</div>` : (r.totalExtra ? `<div style="font-size:11px; color:var(--muted);">base ${fmtBRL(r.totalBase)} ${r.totalExtra >= 0 ? '+' : '−'} ${fmtBRL(Math.abs(r.totalExtra))} extra</div>` : '')}
        </div>
      </summary>
      ${c.tipo === 'diarista' ? `
        <div style="padding:0 12px 12px;">
          ${dias.length === 0 ? `<div style="font-size:12px; color:var(--muted); padding:4px 0;">Nenhum dia lançado neste período.</div>` :
            dias.map(d => {
              const v = valorDia(d, c);
              const obra = getObraFolha(d.obraId);
              const rot = d.jornadaTipo === 'cheia' ? 'Diária' : (d.jornadaTipo === 'meia' ? 'Meia diária' : 'Falta');
              return `
                <div class="row-between" style="padding:6px 0; border-top:1px solid var(--border); font-size:12px;" onclick="actions.editarDiaTrabalhado('${d.id}')">
                  <div style="cursor:pointer;">
                    <strong>${fmtDataCurta(d.data)}</strong> · ${rot}${d.saldoHoras ? ' · ' + (d.saldoHoras > 0 ? '+' : '') + d.saldoHoras + 'h' : ''}
                    ${obra ? `<span style="color:var(--muted);"> · ${esc(obra.nome)}</span>` : ''}
                  </div>
                  <div style="font-weight:600;">${fmtBRL(v.total)}</div>
                </div>
              `;
            }).join('')}
          <button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="actions.novoDiaTrabalhado('${c.id}')">${ICON.plus} Lançar dia</button>
        </div>
      ` : ''}
      <div style="padding:8px 12px 12px; border-top:1px solid var(--border);">
        <button class="btn btn-secondary btn-sm" style="width:100%;" onclick="actions.abrirReciboPagamento('${c.id}')" ${r.totalLiquido <= 0 ? 'disabled' : ''}>${ICON.file} Gerar recibo de pagamento</button>
      </div>
    </details>
  `;
}

function fmtDataCurta(iso) {
  try { const [y, m, d] = iso.split('-'); return `${d}/${m}`; } catch (e) { return iso; }
}

function modalEditarDia() {
  const d = state.modal.data;
  const colab = getColaborador(d.colaboradorId);
  const obras = (state.obrasFolha || []).filter(o => o.ativo !== false);
  const colaboradores = (state.colaboradores || []).filter(c => c.ativo !== false && c.tipo === 'diarista');
  const previa = colab ? valorDia({ jornadaTipo: d.jornadaTipo, saldoHoras: Number(d.saldoHoras) || 0 }, colab) : null;
  // Quem já foi lançado nesta data + obra (ajuda a registrar o time todo sem perder ninguém)
  let jaLancados = [];
  if (d.data && d.obraId) {
    jaLancados = (state.diasTrabalhados || [])
      .filter(x => x.data === d.data && x.obraId === d.obraId && x.id !== d.id)
      .map(x => (getColaborador(x.colaboradorId) || {}).nome || '?');
  }
  return `
    <div class="modal-overlay" onclick="actions.fecharModal()">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <div class="modal-title">${d.id ? 'Editar' : 'Registrar'} dia trabalhado</div>
          <button class="modal-close" onclick="actions.fecharModal()">${ICON.x}</button>
        </div>
        <div class="modal-body">
          ${!d.id && jaLancados.length > 0 ? `
            <div style="background:#EFF6FF; border:1px solid #BFDBFE; border-radius:8px; padding:8px 10px; margin-bottom:12px; font-size:12px; color:var(--primary);">
              ${ICON.check} <strong>${jaLancados.length}</strong> já lançado(s) nesta data/obra: ${jaLancados.map(n => esc(n)).join(', ')}
            </div>
          ` : ''}
          <div class="form-group">
            <label>Colaborador</label>
            <select onchange="actions.updateDiaForm('colaboradorId', this.value)">
              <option value="">Selecione...</option>
              ${colaboradores.map(c => `<option value="${c.id}" ${c.id === d.colaboradorId ? 'selected' : ''}>${esc(c.nome)}</option>`).join('')}
            </select>
            ${colaboradores.length === 0 ? `<div style="font-size:11px; color:var(--danger); margin-top:4px;">Cadastre um colaborador diarista primeiro.</div>` : ''}
          </div>
          <div class="row" style="gap:8px;">
            <div class="form-group" style="flex:1;">
              <label>Data</label>
              <input type="date" value="${esc(d.data || '')}" oninput="actions.updateDiaForm('data', this.value)">
            </div>
            <div class="form-group" style="flex:1;">
              <label>Obra</label>
              <select onchange="actions.updateDiaForm('obraId', this.value)">
                <option value="">Selecione...</option>
                ${obras.map(o => `<option value="${o.id}" ${o.id === d.obraId ? 'selected' : ''}>${esc(o.nome)}</option>`).join('')}
              </select>
            </div>
          </div>
          ${obras.length === 0 ? `<div style="font-size:11px; color:var(--danger); margin:-8px 0 12px;">Cadastre uma obra primeiro.</div>` : ''}
          <div class="form-group">
            <label>Jornada</label>
            <div class="mode-row">
              <button class="mode-btn ${d.jornadaTipo === 'cheia' ? 'active' : ''}" onclick="actions.updateDiaForm('jornadaTipo', 'cheia')">Diária cheia</button>
              <button class="mode-btn ${d.jornadaTipo === 'meia' ? 'active' : ''}" onclick="actions.updateDiaForm('jornadaTipo', 'meia')">Meia diária</button>
              <button class="mode-btn ${d.jornadaTipo === 'falta' ? 'active' : ''}" onclick="actions.updateDiaForm('jornadaTipo', 'falta')">Faltou</button>
            </div>
          </div>
          ${d.jornadaTipo !== 'falta' ? `
            <div class="form-group">
              <label>Saldo de horas (opcional)</label>
              <input type="number" step="0.5" value="${esc(d.saldoHoras || 0)}" oninput="actions.updateDiaForm('saldoHoras', this.value)" placeholder="0">
              <div style="font-size:11px; color:var(--muted); margin-top:4px;">Positivo = hora extra (chegou cedo/saiu tarde). Negativo = desconto (chegou tarde). Ex: 2 ou -1</div>
            </div>
          ` : ''}
          <div class="form-group">
            <label>Observação (opcional)</label>
            <input type="text" value="${esc(d.obs || '')}" oninput="actions.updateDiaForm('obs', this.value)" placeholder="Ex: saiu 1h mais cedo">
          </div>
          ${previa ? `
            <div class="card" style="background:var(--bg-soft,#F8FAFC); padding:12px; margin-bottom:12px;">
              <div class="row-between"><span style="font-size:13px;">Valor do dia:</span><strong style="color:var(--success); font-size:18px;">${fmtBRL(previa.total)}</strong></div>
              ${previa.extra ? `<div style="font-size:11px; color:var(--muted); margin-top:4px;">base ${fmtBRL(previa.base)} ${previa.extra >= 0 ? '+' : '−'} ${fmtBRL(Math.abs(previa.extra))} (${(Number(d.saldoHoras) || 0) > 0 ? 'extra' : 'desconto'})</div>` : ''}
            </div>
          ` : ''}
          <div style="display:flex; gap:8px; flex-wrap:wrap;">

              <button class="btn btn-primary" style="flex:1;" onclick="actions.salvarDia(false)">${ICON.check} Salvar</button>
            ` : `
              <button class="btn btn-secondary" style="flex:1; min-width:130px;" onclick="actions.salvarDia(true)">${ICON.plus} Registrar e próximo</button>
